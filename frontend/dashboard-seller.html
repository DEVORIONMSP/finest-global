<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Dashboard vendeur — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .dashboard {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 70px);
      background: var(--gray-50);
    }
    
    .sidebar {
      background: var(--blue-900);
      color: var(--white);
      padding: 24px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    
    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }
    
    .sidebar-shop-name {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--white);
    }
    
    .sidebar-shop-status {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
    }
    
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius);
      color: rgba(255,255,255,0.75);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all var(--transition);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }
    
    .sidebar-link:hover {
      background: rgba(255,255,255,0.08);
      color: var(--white);
    }
    
    .sidebar-link.active {
      background: var(--blue-700);
      color: var(--white);
    }
    
    .sidebar-link-icon { font-size: 1.1rem; }
    
    .sidebar-badge {
      margin-left: auto;
      background: var(--orange-500);
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }
    
    .dashboard-main {
      padding: 32px;
      min-width: 0;
    }
    
    .dashboard-header {
      margin-bottom: 28px;
    }
    
    .dashboard-header h1 {
      font-size: 1.75rem;
      color: var(--blue-900);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    
    .dashboard-header p {
      color: var(--gray-500);
      font-size: 0.95rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: all var(--transition);
    }
    
    .stat-card:hover {
      border-color: var(--blue-500);
      box-shadow: var(--shadow-md);
    }
    
    .stat-card-icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    
    .stat-card-value {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--blue-900);
      letter-spacing: -1px;
      margin-bottom: 4px;
    }
    
    .stat-card-label {
      font-size: 0.85rem;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-card.pending {
      border-color: var(--orange-500);
      background: linear-gradient(135deg, var(--orange-100), var(--white));
    }
    
    .orders-list {
      display: grid;
      gap: 12px;
    }
    
    .order-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      transition: all var(--transition);
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .order-card:hover {
      border-color: var(--blue-500);
      box-shadow: var(--shadow);
    }
    
    .order-card.new {
      border-color: var(--orange-500);
      background: linear-gradient(135deg, var(--orange-100), var(--white));
      animation: pulse-border 2s infinite;
    }
    
    @keyframes pulse-border {
      0%, 100% { border-color: var(--orange-500); }
      50% { border-color: var(--orange-400); }
    }
    
    .order-info {
      display: flex;
      gap: 16px;
      align-items: center;
      min-width: 0;
    }
    
    .order-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      background: var(--blue-50);
      color: var(--blue-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    
    .order-details { min-width: 0; }
    
    .order-title {
      font-weight: 700;
      color: var(--blue-900);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .order-meta {
      font-size: 0.85rem;
      color: var(--gray-500);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .order-price {
      font-weight: 800;
      color: var(--orange-600);
    }
    
    .order-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .products-grid-admin {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    
    .admin-product-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--transition);
    }
    
    .admin-product-card:hover {
      border-color: var(--blue-500);
      box-shadow: var(--shadow-md);
    }
    
    .admin-product-image {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--blue-50), var(--gray-100));
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--gray-500);
    }
    
    .admin-product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .admin-product-body { padding: 14px; }
    
    .admin-product-name {
      font-weight: 700;
      color: var(--blue-900);
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    
    .admin-product-category {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--blue-700);
      background: var(--blue-50);
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      text-transform: capitalize;
    }
    
    .admin-product-price {
      color: var(--orange-600);
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .admin-product-stats {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--gray-500);
      margin-bottom: 12px;
    }
    
    .admin-product-actions {
      display: flex;
      gap: 8px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .image-upload {
      border: 2px dashed var(--gray-300);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--gray-50);
    }
    
    .image-upload:hover {
      border-color: var(--blue-500);
      background: var(--blue-50);
    }
    
    .image-upload input[type="file"] { display: none; }
    
    .image-preview {
      max-width: 200px;
      max-height: 200px;
      border-radius: var(--radius);
      margin: 0 auto;
    }
    
    .category-input-wrapper { position: relative; }
    
    .category-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: white;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    
    .category-suggestions.open { display: block; }
    
    .category-suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s;
    }
    
    .category-suggestion-item:hover,
    .category-suggestion-item.active {
      background: var(--blue-50);
    }
    
    .category-suggestion-emoji { font-size: 1.2rem; }
    
    .category-suggestion-info { flex: 1; min-width: 0; }
    
    .category-suggestion-name {
      font-weight: 600;
      color: var(--blue-900);
      text-transform: capitalize;
      font-size: 0.9rem;
    }
    
    .category-suggestion-desc {
      font-size: 0.75rem;
      color: var(--gray-500);
    }
    
    .category-suggestions-empty {
      padding: 12px 16px;
      color: var(--gray-500);
      font-size: 0.85rem;
      text-align: center;
    }
    
    .product-badge-stock {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .badge-stock-yes { background: #D1FAE5; color: #065F46; }
    .badge-stock-no { background: #FEE2E2; color: #991B1B; }
    .badge-stock-to-confirm { background: #FEF3C7; color: #92400E; }
    
    /* 🆕 Carte + code boutique */
    .map-container {
      height: 300px;
      border-radius: var(--radius);
      border: 1.5px solid var(--gray-200);
      overflow: hidden;
      margin-top: 8px;
    }
    
    .shop-code-display {
      background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
      color: var(--white);
      padding: 16px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .shop-code-display .label {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-bottom: 2px;
    }
    
    .shop-code-display .code {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    
    .shop-code-display button {
      background: rgba(255,255,255,0.15);
      color: var(--white);
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
      font-family: inherit;
    }
    
    .shop-code-display button:hover {
      background: rgba(255,255,255,0.25);
    }
    
    @media (max-width: 900px) {
      .dashboard { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        padding: 16px 0;
      }
      .sidebar-nav {
        flex-direction: row;
        overflow-x: auto;
        padding: 0 16px;
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar-nav::-webkit-scrollbar { display: none; }
      .sidebar-link {
        white-space: nowrap;
        padding: 10px 14px;
      }
      .dashboard-main { padding: 20px 16px; }
      .order-card { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
    
    @media (max-width: 640px) {
      .dashboard { min-height: calc(100vh - 60px); }
      
      .sidebar {
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        height: auto;
      }
      
      .sidebar-header {
        padding: 0 14px 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      
      .sidebar-shop-name { font-size: 0.95rem; margin-bottom: 2px; }
      .sidebar-shop-status { font-size: 0.7rem; }
      .status-dot { width: 6px; height: 6px; }
      
      .sidebar-nav { padding: 0 10px; gap: 6px; }
      
      .sidebar-link {
        padding: 8px 12px;
        font-size: 0.82rem;
        gap: 8px;
        border-radius: 8px;
      }
      
      .sidebar-link-icon { font-size: 1rem; }
      .sidebar-badge { font-size: 0.65rem; padding: 1px 6px; }
      
      .dashboard-main { padding: 16px 12px 32px; }
      .dashboard-header { margin-bottom: 20px; }
      .dashboard-header h1 { font-size: 1.35rem; margin-bottom: 4px; }
      .dashboard-header p { font-size: 0.85rem; }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }
      
      .stats-grid[style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }
      
      .stat-card { padding: 14px; }
      .stat-card-icon { font-size: 1.25rem; margin-bottom: 6px; }
      .stat-card-value { font-size: 1.3rem; }
      .stat-card-label { font-size: 0.7rem; }
      .stat-card h3 { font-size: 0.95rem !important; margin-bottom: 8px !important; }
      
      .order-card { padding: 14px; gap: 12px; }
      .order-info { gap: 10px; }
      .order-icon { width: 38px; height: 38px; font-size: 1.15rem; }
      
      .order-title {
        font-size: 0.88rem;
        white-space: normal;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        display: -webkit-box;
        overflow: hidden;
      }
      
      .order-meta { font-size: 0.72rem; gap: 8px; }
      .order-meta .badge { font-size: 0.65rem; padding: 3px 8px; }
      .order-price { font-size: 1rem; }
      .order-actions .btn { padding: 7px 12px; font-size: 0.78rem; }
      
      .products-grid-admin { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .admin-product-body { padding: 10px; }
      .admin-product-name { font-size: 0.85rem; margin-bottom: 4px; }
      .admin-product-category { font-size: 0.68rem; padding: 2px 6px; }
      .admin-product-price { font-size: 0.9rem; margin-bottom: 6px; }
      .admin-product-stats { font-size: 0.7rem; gap: 8px; margin-bottom: 8px; }
      .admin-product-actions { gap: 4px; }
      .admin-product-actions .btn { padding: 6px 8px; font-size: 0.72rem; }
      
      .modal { max-width: 100% !important; }
      .form-row { gap: 0; }
      .image-upload { padding: 16px; }
      .image-preview { max-width: 140px; max-height: 140px; }
      
      .map-container { height: 220px; }
      .shop-code-display .code { font-size: 1.15rem; }
    }
    
    @media (max-width: 380px) {
      .dashboard-header h1 { font-size: 1.15rem; }
      .stats-grid { grid-template-columns: 1fr; }
      .sidebar-link { padding: 7px 10px; font-size: 0.78rem; }
      .order-meta { font-size: 0.68rem; }
      .admin-product-name { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="dashboard">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-shop-name" id="sidebar-shop-name">...</div>
        <div class="sidebar-shop-status">
          <span class="status-dot"></span>
          <span data-i18n="seller.notifications_active">Notifications actives</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <button class="sidebar-link active" onclick="switchTab('overview')" data-tab="overview">
          <span class="sidebar-link-icon">📊</span>
          <span data-i18n="seller.overview">Vue d'ensemble</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('orders')" data-tab="orders">
          <span class="sidebar-link-icon">📦</span>
          <span data-i18n="seller.orders">Commandes</span>
          <span class="sidebar-badge hidden" id="orders-badge">0</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('products')" data-tab="products">
          <span class="sidebar-link-icon">🛍️</span>
          <span data-i18n="seller.products">Mes produits</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('shop')" data-tab="shop">
          <span class="sidebar-link-icon">🏪</span>
          <span data-i18n="seller.shop">Ma boutique</span>
        </button>
      </nav>
    </aside>
    
    <main class="dashboard-main" id="dashboard-main">
      <div class="loading-container">
        <span class="spinner spinner-blue" style="width: 40px; height: 40px;"></span>
      </div>
    </main>
    
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/shop-map.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let currentShop = null;
    let currentProducts = [];
    let currentOrders = [];
    let editingProductId = null;
    let productImageFile = null;
    let shopImageFile = null;
    let ws = null;
    let newOrdersCount = 0;
    let allCategories = null;
    
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar();
      
      if (!Auth.requireSeller()) return;
      
      try {
        currentShop = await ShopsAPI.getMine();
        document.getElementById('sidebar-shop-name').textContent = currentShop.name;
      } catch (error) {
        if (error.status === 404) {
          showToast(t('shop.create_title'), 'info');
          setTimeout(() => window.location.href = '/create-shop.html', 800);
          return;
        }
        showToast(error.message, 'error');
        return;
      }
      
      loadCategoriesCache();
      await Promise.all([loadProducts(), loadOrders()]);
      switchTab('overview');
      startWebSocket();
    });
    
    async function loadCategoriesCache() {
      try {
        allCategories = await CategoriesAPI.list();
      } catch (error) {
        console.error('Erreur chargement catégories:', error);
        allCategories = [];
      }
    }
    
    function switchTab(tabName) {
      document.querySelectorAll('.sidebar-link').forEach(link => {
        link.classList.toggle('active', link.dataset.tab === tabName);
      });
      
      // Détruire la carte si on quitte l'onglet shop
      if (tabName !== 'shop') {
        destroyShopMap();
      }
      
      if (tabName === 'overview') renderOverview();
      else if (tabName === 'orders') {
        renderOrders();
        newOrdersCount = 0;
        updateOrdersBadge();
      } else if (tabName === 'products') renderProducts();
      else if (tabName === 'shop') renderShopSettings();
    }
    
    function renderOverview() {
      const totalSales = currentProducts.reduce((sum, p) => sum + p.sales_count, 0);
      const totalViews = currentProducts.reduce((sum, p) => sum + p.views_count, 0);
      const totalRevenue = currentOrders
        .filter(o => o.status === 'confirmed' || o.status === 'delivered')
        .reduce((sum, o) => sum + o.total_price, 0);
      const pendingOrders = currentOrders.filter(o => o.status === 'pending').length;
      
      const topProducts = [...currentProducts]
        .sort((a, b) => b.sales_count - a.sales_count)
        .slice(0, 5);
      
      const main = document.getElementById('dashboard-main');
      main.innerHTML = `
        <div class="dashboard-header">
          <h1>${t('seller.hello')} ${Auth.getUser().first_name || ''} 👋</h1>
          <p>${t('admin.subtitle')}</p>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card-icon">💰</div>
            <div class="stat-card-value">${formatPrice(totalRevenue)}</div>
            <div class="stat-card-label">${t('seller.revenue')}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">📦</div>
            <div class="stat-card-value">${totalSales}</div>
            <div class="stat-card-label">${t('seller.total_sales')}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">👁️</div>
            <div class="stat-card-value">${totalViews}</div>
            <div class="stat-card-label">${t('seller.product_views')}</div>
          </div>
          <div class="stat-card ${pendingOrders > 0 ? 'pending' : ''}">
            <div class="stat-card-icon">⏳</div>
            <div class="stat-card-value">${pendingOrders}</div>
            <div class="stat-card-label">${t('seller.pending')}</div>
          </div>
        </div>
        
        <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="stat-card">
            <h3 style="font-size:1.1rem;margin-bottom:12px;">${t('seller.top_products')}</h3>
            ${topProducts.length === 0 
              ? `<p style="color:var(--gray-500);font-size:0.9rem;">${t('seller.no_products')}</p>`
              : topProducts.map((p, i) => `
                <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--gray-100);">

    function initCategoryAutocomplete() {
      const input = document.getElementById('p-category');
      const suggestions = document.getElementById('p-category-suggestions');
      if (!input || !suggestions) return;
      
      function renderSuggestions(filter = '') {
        const q = filter.toLowerCase().trim();
        
        const filtered = (allCategories || []).filter(c => 
          c.name.toLowerCase().includes(q) ||
          (c.description && c.description.toLowerCase().includes(q))
        );
        
        if (filtered.length === 0) {
          suggestions.innerHTML = `<div class="category-suggestions-empty">—</div>`;
          suggestions.classList.add('open');
          return;
        }
        
        suggestions.innerHTML = filtered.slice(0, 10).map(c => `
          <div class="category-suggestion-item" data-name="${escapeHtml(c.name)}">
            <span class="category-suggestion-emoji">${c.emoji || '🏷️'}</span>
            <div class="category-suggestion-info">
              <div class="category-suggestion-name">${escapeHtml(c.name)}</div>
              ${c.description ? `<div class="category-suggestion-desc">${escapeHtml(c.description)}</div>` : ''}
            </div>
          </div>
        `).join('');
        
        suggestions.classList.add('open');
        
        suggestions.querySelectorAll('.category-suggestion-item').forEach(item => {
          item.addEventListener('click', () => {
            input.value = item.dataset.name;
            suggestions.classList.remove('open');
          });
        });
      }
      
      input.addEventListener('focus', () => renderSuggestions(input.value));
      input.addEventListener('input', () => renderSuggestions(input.value));
      
      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !suggestions.contains(e.target)) {
          suggestions.classList.remove('open');
        }
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') suggestions.classList.remove('open');
        if (e.key === 'Enter') {
          e.preventDefault();
          const first = suggestions.querySelector('.category-suggestion-item');
          if (first && suggestions.classList.contains('open')) {
            input.value = first.dataset.name;
            suggestions.classList.remove('open');
          }
        }
      });
    }

    async function saveProduct() {
      const btn = document.getElementById('save-product-btn');
      const errorDiv = document.getElementById('product-error');
      
      errorDiv.classList.add('hidden');
      
      const data = {
        name: document.getElementById('p-name').value.trim(),
        description: document.getElementById('p-desc').value.trim() || null,
        price: parseFloat(document.getElementById('p-price').value),
        category: document.getElementById('p-category').value.trim() || null,
        color: document.getElementById('p-color').value.trim() || null,
        availability: document.getElementById('p-availability').value,
      };
      
      if (!data.name) {
        errorDiv.textContent = '—';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (!data.price || data.price <= 0) {
        errorDiv.textContent = '—';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      
      try {
        let product;
        
        if (editingProductId) {
          product = await ProductsAPI.update(editingProductId, data);
          
          if (productImageFile) {
            product = await ProductsAPI.uploadPhoto(editingProductId, productImageFile);
          }
          
          showToast('✅', 'success');
        } else {
          product = await ProductsAPI.create(data);
          
          if (productImageFile) {
            product = await ProductsAPI.uploadPhoto(product.id, productImageFile);
          }
          
          showToast('✅', 'success');
        }
        
        closeProductModal();
        await loadProducts();
        renderProducts();
        renderOverview();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = editingProductId ? t('seller.edit') : t('seller.add_product');
      }
    }

      const token = Auth.getToken();
      if (!token) return;
      
      const isLocal = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1';
      
      const API_HOST = isLocal ? '127.0.0.1:8000' : 'finest-global-api.onrender.com';
      const WS_PROTOCOL = isLocal ? 'ws' : 'wss';
      
      const wsUrl = `${WS_PROTOCOL}://${API_HOST}/ws/notifications?token=${token}`;
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => console.log('🟢 WebSocket connecté');
      
      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          
          if (message.type === 'new_order') {
            handleNewOrder(message.order);
          }
        } catch (error) {
          console.error('Erreur WebSocket:', error);
        }
      };
      
      ws.onerror = (error) => console.error('WebSocket erreur:', error);
      
      ws.onclose = () => {
        setTimeout(startWebSocket, 3000);
      };
    }
    
    async function handleNewOrder(orderData) {
      showToast(
        `🔔 ${t('seller.new_order')} : ${orderData.product_name} (${orderData.quantity}x)`,
        'orange',
        8000
      );
      
      newOrdersCount++;
      updateOrdersBadge();
      
      await loadOrders();
      
      const activeTab = document.querySelector('.sidebar-link.active')?.dataset.tab;
      if (activeTab === 'orders') renderOrders();
      else if (activeTab === 'overview') renderOverview();
    }
  </script>
</body>
</html>
