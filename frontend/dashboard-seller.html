<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Dashboard vendeur — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    :root {
      --brand-dark:        rgba(58, 22, 6, 0.92);
      --brand-dark-solid:  #3A1606;
      --brand-dark-deep:   #2A0F03;
      --brand-dark-soft:   rgba(58, 22, 6, 0.75);
      --silver:            rgb(170, 169, 173);
      --silver-light:      rgba(170, 169, 173, 0.45);
      --silver-soft:       rgba(170, 169, 173, 0.2);
      --cream:             rgb(255, 253, 209);
      --cream-card:        rgba(255, 253, 209, 0.55);
      --cream-soft:        rgba(255, 253, 209, 0.88);
      --cream-muted:       rgba(255, 253, 209, 0.7);
      --danger:            #DC2626;
      --success:           #10B981;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 70px);
      background: var(--cream);
    }
    
    .sidebar {
      background: var(--brand-dark);
      color: var(--cream);
      padding: 24px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    
    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--silver-light);
      margin-bottom: 16px;
    }
    
    .sidebar-shop-name {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--cream);
    }
    
    .sidebar-shop-status {
      font-size: 0.8rem;
      color: var(--silver);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }
    .status-dot.inactive {
      background: var(--silver);
      animation: none;
      box-shadow: none;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
    }
    
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius, 10px);
      color: var(--silver);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all var(--transition, 0.2s);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }
    
    .sidebar-link:hover {
      background: rgba(255, 253, 209, 0.08);
      color: var(--cream);
    }
    
    .sidebar-link.active {
      background: var(--brand-dark-deep);
      color: var(--cream);
      box-shadow: inset 3px 0 0 var(--silver);
    }
    
    .sidebar-link-icon { font-size: 1.1rem; }
    
    .sidebar-badge {
      margin-left: auto;
      background: var(--silver);
      color: var(--brand-dark-deep);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }
    
    .dashboard-main {
      padding: 32px;
      min-width: 0;
      background: var(--cream);
    }
    
    .dashboard-header {
      margin-bottom: 28px;
    }
    
    .dashboard-header h1 {
      font-size: 1.75rem;
      color: var(--brand-dark-solid);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    
    .dashboard-header p {
      color: var(--brand-dark-soft);
      font-size: 0.95rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: var(--cream-card);
      border: 1.5px solid var(--silver);
      border-radius: var(--radius-lg, 14px);
      padding: 20px;
      transition: all var(--transition, 0.2s);
    }
    
    .stat-card:hover {
      border-color: var(--brand-dark-solid);
      box-shadow: 0 8px 24px rgba(58, 22, 6, 0.15);
    }
    
    .stat-card-icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    
    .stat-card-value {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--brand-dark-solid);
      letter-spacing: -1px;
      margin-bottom: 4px;
    }
    
    .stat-card-label {
      font-size: 0.85rem;
      color: var(--brand-dark-soft);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-card.pending {
      border-color: var(--brand-dark-solid);
      background: linear-gradient(135deg, rgba(255, 253, 209, 0.85), rgba(255, 253, 209, 0.55));
    }
    
    .orders-list {
      display: grid;
      gap: 12px;
    }
    
    .order-card {
      background: var(--cream-card);
      border: 1.5px solid var(--silver);
      border-radius: var(--radius-lg, 14px);
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      transition: all var(--transition, 0.2s);
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .order-card:hover {
      border-color: var(--brand-dark-solid);
      box-shadow: 0 8px 24px rgba(58, 22, 6, 0.15);
    }
    
    .order-card.new {
      border-color: var(--brand-dark-solid);
      background: linear-gradient(135deg, rgba(255, 253, 209, 0.9), rgba(255, 253, 209, 0.55));
      animation: pulse-border 2s infinite;
    }
    
    @keyframes pulse-border {
      0%, 100% { border-color: var(--brand-dark-solid); }
      50% { border-color: var(--silver); }
    }
    
    .order-info {
      display: flex;
      gap: 16px;
      align-items: center;
      min-width: 0;
    }
    
    .order-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius, 10px);
      background: rgba(58, 22, 6, 0.1);
      color: var(--brand-dark-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    
    .order-details { min-width: 0; }
    
    .order-title {
      font-weight: 700;
      color: var(--brand-dark-solid);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .order-meta {
      font-size: 0.85rem;
      color: var(--brand-dark-soft);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .order-price {
      font-weight: 800;
      color: var(--brand-dark-solid);
    }
    
    .order-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .products-grid-admin {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    
    .admin-product-card {
      background: var(--cream-card);
      border: 1.5px solid var(--silver);
      border-radius: var(--radius-lg, 14px);
      overflow: hidden;
      transition: all var(--transition, 0.2s);
    }
    
    .admin-product-card:hover {
      border-color: var(--brand-dark-solid);
      box-shadow: 0 8px 24px rgba(58, 22, 6, 0.15);
    }
    
    .admin-product-image {
      aspect-ratio: 1;
      background: linear-gradient(135deg, rgba(255, 253, 209, 0.9), rgba(170, 169, 173, 0.35));
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--brand-dark-soft);
    }
    
    .admin-product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .admin-product-body { padding: 14px; }
    
    .admin-product-name {
      font-weight: 700;
      color: var(--brand-dark-solid);
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    
    .admin-product-category {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--brand-dark-solid);
      background: rgba(170, 169, 173, 0.35);
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      text-transform: capitalize;
    }
    
    .admin-product-price {
      color: var(--brand-dark-solid);
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .admin-product-stats {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--brand-dark-soft);
      margin-bottom: 12px;
    }
    
    .admin-product-actions {
      display: flex;
      gap: 8px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .image-upload {
      border: 2px dashed var(--silver);
      border-radius: var(--radius, 10px);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition, 0.2s);
      background: rgba(255, 253, 209, 0.85);
    }
    
    .image-upload:hover {
      border-color: var(--brand-dark-solid);
      background: rgba(255, 253, 209, 0.95);
    }
    
    .image-upload input[type="file"] { display: none; }
    
    .image-preview {
      max-width: 200px;
      max-height: 200px;
      border-radius: var(--radius, 10px);
      margin: 0 auto;
    }
    
    .category-input-wrapper { position: relative; }
    
    .category-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--cream);
      border: 1.5px solid var(--silver);
      border-radius: var(--radius, 10px);
      box-shadow: 0 8px 24px rgba(58, 22, 6, 0.2);
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    
    .category-suggestions.open { display: block; }
    
    .category-suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s;
    }
    
    .category-suggestion-item:hover,
    .category-suggestion-item.active {
      background: rgba(170, 169, 173, 0.3);
    }
    
    .category-suggestion-emoji { font-size: 1.2rem; }
    
    .category-suggestion-info { flex: 1; min-width: 0; }
    
    .category-suggestion-name {
      font-weight: 600;
      color: var(--brand-dark-solid);
      text-transform: capitalize;
      font-size: 0.9rem;
    }
    
    .category-suggestion-desc {
      font-size: 0.75rem;
      color: var(--brand-dark-soft);
    }
    
    .category-suggestions-empty {
      padding: 12px 16px;
      color: var(--brand-dark-soft);
      font-size: 0.85rem;
      text-align: center;
    }
    
    .product-badge-stock {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .badge-stock-yes { background: #D1FAE5; color: #065F46; }
    .badge-stock-no { background: #FEE2E2; color: #991B1B; }
    .badge-stock-to-confirm { background: var(--cream); color: var(--brand-dark-solid); border: 1px solid var(--brand-dark-solid); }
    
    /* Carte + code boutique */
    .map-container {
      height: 300px;
      border-radius: var(--radius, 10px);
      border: 1.5px solid var(--silver);
      overflow: hidden;
      margin-top: 8px;
    }
    
    .shop-code-display {
      background: linear-gradient(135deg, var(--brand-dark-solid), var(--brand-dark-deep));
      color: var(--cream);
      padding: 16px 20px;
      border-radius: var(--radius, 10px);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border: 1.5px solid var(--silver-light);
    }
    
    .shop-code-display .label {
      font-size: 0.85rem;
      color: var(--silver);
      margin-bottom: 2px;
    }
    
    .shop-code-display .code {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--cream);
    }
    
    .shop-code-display button {
      background: rgba(255, 253, 209, 0.15);
      color: var(--cream);
      border: 1px solid var(--silver-light);
      padding: 8px 16px;
      border-radius: var(--radius, 10px);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
      font-family: inherit;
    }
    
    .shop-code-display button:hover {
      background: rgba(255, 253, 209, 0.25);
    }

    /* Statut de la boutique */
    .storefront-status-card {
      background: var(--cream-card);
      border: 1.5px solid var(--silver);
      border-radius: var(--radius-lg, 14px);
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .storefront-status-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .storefront-status-badge {
      font-size: 1.2rem;
      font-weight: 800;
    }
    .storefront-status-badge.active { color: var(--success); }
    .storefront-status-badge.inactive { color: var(--silver); }
    
    /* Boutons personnalisés */
    .btn-primary {
      background: var(--brand-dark-solid);
      color: var(--cream);
      border: 1.5px solid var(--brand-dark-solid);
    }
    
    .btn-primary:hover {
      background: var(--brand-dark-deep);
      border-color: var(--brand-dark-deep);
      color: var(--cream);
    }
    
    .btn-ghost {
      background: transparent;
      color: var(--brand-dark-solid);
      border: 1.5px solid var(--silver);
    }
    
    .btn-ghost:hover {
      background: rgba(255, 253, 209, 0.85);
      border-color: var(--brand-dark-solid);
    }
    
    .btn-danger {
      background: var(--danger);
      color: var(--cream);
      border: 1.5px solid var(--danger);
    }
    
    .btn-danger:hover {
      background: #B91C1C;
      border-color: #B91C1C;
    }
    
    .btn-success {
      background: var(--success);
      color: white;
      border: 1.5px solid var(--success);
    }
    .btn-success:hover {
      background: #059669;
      border-color: #059669;
    }
    
    /* Badges statut commande */
    .badge-warning {
      background: var(--cream);
      color: var(--brand-dark-solid);
      border: 1px solid var(--brand-dark-solid);
    }
    .badge-blue {
      background: rgba(170, 169, 173, 0.4);
      color: var(--brand-dark-solid);
      border: 1px solid var(--silver);
    }
    .badge-success {
      background: #D1FAE5;
      color: #065F46;
    }
    .badge-danger {
      background: #FEE2E2;
      color: #991B1B;
    }
    
    /* Inputs */
    .form-input, .form-textarea, .form-select {
      background: rgba(255, 253, 209, 0.85);
      border: 1.5px solid var(--silver);
      color: var(--brand-dark-solid);
      border-radius: var(--radius, 10px);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--brand-dark-solid);
      background: var(--cream);
      box-shadow: 0 0 0 3px rgba(58, 22, 6, 0.15);
    }
    
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--brand-dark-solid);
      margin-bottom: 6px;
      display: block;
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 15, 3, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }
    
    .modal {
      background: var(--cream);
      border-radius: var(--radius-lg, 14px);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1.5px solid var(--silver);
      box-shadow: 0 24px 64px rgba(42, 15, 3, 0.4);
    }
    
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1.5px solid var(--silver);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--brand-dark);
    }
    
    .modal-header h3 {
      color: var(--cream);
      font-size: 1.1rem;
      margin: 0;
    }
    
    .modal-close {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: var(--cream);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    
    .modal-close:hover { background: rgba(255, 253, 209, 0.15); }
    
    .modal-body { padding: 24px; }
    
    .modal-footer {
      padding: 16px 24px;
      border-top: 1.5px solid var(--silver);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: rgba(255, 253, 209, 0.6);
    }
    
    /* Alertes */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius, 10px);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    .alert-error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }
    .alert-success {
      background: #D1FAE5;
      color: #065F46;
      border: 1px solid #6EE7B7;
    }
    
    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 253, 209, 0.3);
      border-top-color: var(--cream);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .spinner-blue {
      border-color: rgba(58, 22, 6, 0.2);
      border-top-color: var(--brand-dark-solid);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .loading-container {
      display: flex;
      justify-content: center;
      padding: 60px 0;
    }
    
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--cream-card);
      border: 1.5px dashed var(--silver);
      border-radius: var(--radius-lg, 14px);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 {
      color: var(--brand-dark-solid);
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    .empty-state p {
      color: var(--brand-dark-soft);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    
    @media (max-width: 900px) {
      .dashboard { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        padding: 16px 0;
      }
      .sidebar-nav {
        flex-direction: row;
        overflow-x: auto;
        padding: 0 16px;
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar-nav::-webkit-scrollbar { display: none; }
      .sidebar-link {
        white-space: nowrap;
        padding: 10px 14px;
      }
      .dashboard-main { padding: 20px 16px; }
      .order-card { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
    
    @media (max-width: 640px) {
      .dashboard { min-height: calc(100vh - 60px); }
      
      .sidebar {
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: 0 2px 8px rgba(58, 22, 6, 0.25);
        height: auto;
      }
      
      .sidebar-header {
        padding: 0 14px 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      
      .sidebar-shop-name { font-size: 0.95rem; margin-bottom: 2px; }
      .sidebar-shop-status { font-size: 0.7rem; }
      .status-dot { width: 6px; height: 6px; }
      
      .sidebar-nav { padding: 0 10px; gap: 6px; }
      
      .sidebar-link {
        padding: 8px 12px;
        font-size: 0.82rem;
        gap: 8px;
        border-radius: 8px;
      }
      
      .sidebar-link-icon { font-size: 1rem; }
      .sidebar-badge { font-size: 0.65rem; padding: 1px 6px; }
      
      .dashboard-main { padding: 16px 12px 32px; }
      .dashboard-header { margin-bottom: 20px; }
      .dashboard-header h1 { font-size: 1.35rem; margin-bottom: 4px; }
      .dashboard-header p { font-size: 0.85rem; }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }
      
      .stats-grid[style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }
      
      .stat-card { padding: 14px; }
      .stat-card-icon { font-size: 1.25rem; margin-bottom: 6px; }
      .stat-card-value { font-size: 1.3rem; }
      .stat-card-label { font-size: 0.7rem; }
      .stat-card h3 { font-size: 0.95rem !important; margin-bottom: 8px !important; }
      
      .order-card { padding: 14px; gap: 12px; }
      .order-info { gap: 10px; }
      .order-icon { width: 38px; height: 38px; font-size: 1.15rem; }
      
      .order-title {
        font-size: 0.88rem;
        white-space: normal;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        display: -webkit-box;
        overflow: hidden;
      }
      
      .order-meta { font-size: 0.72rem; gap: 8px; }
      .order-meta .badge { font-size: 0.65rem; padding: 3px 8px; }
      .order-price { font-size: 1rem; }
      .order-actions .btn { padding: 7px 12px; font-size: 0.78rem; }
      
      .products-grid-admin { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .admin-product-body { padding: 10px; }
      .admin-product-name { font-size: 0.85rem; margin-bottom: 4px; }
      .admin-product-category { font-size: 0.68rem; padding: 2px 6px; }
      .admin-product-price { font-size: 0.9rem; margin-bottom: 6px; }
      .admin-product-stats { font-size: 0.7rem; gap: 8px; margin-bottom: 8px; }
      .admin-product-actions { gap: 4px; }
      .admin-product-actions .btn { padding: 6px 8px; font-size: 0.72rem; }
      
      .modal { max-width: 100% !important; }
      .form-row { gap: 0; }
      .image-upload { padding: 16px; }
      .image-preview { max-width: 140px; max-height: 140px; }
      
      .map-container { height: 220px; }
      .shop-code-display .code { font-size: 1.15rem; }
      .storefront-status-card { flex-direction: column; align-items: stretch; text-align: center; }
    }
    
    @media (max-width: 380px) {
      .dashboard-header h1 { font-size: 1.15rem; }
      .stats-grid { grid-template-columns: 1fr; }
      .sidebar-link { padding: 7px 10px; font-size: 0.78rem; }
      .order-meta { font-size: 0.68rem; }
      .admin-product-name { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="dashboard">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-shop-name" id="sidebar-shop-name">...</div>
        <div class="sidebar-shop-status">
          <span class="status-dot" id="sidebar-status-dot"></span>
          <span id="sidebar-status-text" data-i18n="seller.notifications_active">Notifications actives</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <button class="sidebar-link active" onclick="switchTab('overview')" data-tab="overview">
          <span class="sidebar-link-icon">📊</span>
          <span data-i18n="seller.overview">Vue d'ensemble</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('orders')" data-tab="orders">
          <span class="sidebar-link-icon">📦</span>
          <span data-i18n="seller.orders">Commandes</span>
          <span class="sidebar-badge hidden" id="orders-badge">0</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('products')" data-tab="products">
          <span class="sidebar-link-icon">🛍️</span>
          <span data-i18n="seller.products">Mes produits</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('services')" data-tab="services">
          <span class="sidebar-link-icon">🛠️</span>
          <span data-i18n="seller.services">Mes services</span>
        </button>
        <button class="sidebar-link" onclick="switchTab('shop')" data-tab="shop">
          <span class="sidebar-link-icon">🏪</span>
          <span data-i18n="seller.shop">Ma vitrine</span>
        </button>
      </nav>
    </aside>
    
    <main class="dashboard-main" id="dashboard-main">
      <div class="loading-container">
        <span class="spinner spinner-blue" style="width: 40px; height: 40px;"></span>
      </div>
    </main>
    
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/shop-map.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let currentShop = null;
    let currentProducts = [];
    let currentServices = [];
    let currentOrders = [];
    let editingProductId = null;
    let editingServiceId = null;
    let productImageFile = null;
    let productVideoFile = null;
    let serviceImageFile = null;
    let serviceVideoFile = null;
    let shopImageFile = null;
    let ws = null;
    let newOrdersCount = 0;
    
    // 🆕 Catégories séparées par type
    let productCategories = [];
    let serviceCategories = [];
    
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar();
      
      if (!Auth.requireSeller()) return;
      
      try {
        currentShop = await ShopsAPI.getMine();
        document.getElementById('sidebar-shop-name').textContent = currentShop.name;
        updateSidebarStatus();
      } catch (error) {
        if (error.status === 404) {
          showToast(t('shop.create_title'), 'info');
          setTimeout(() => window.location.href = '/create-shop.html', 800);
          return;
        }
        showToast(error.message, 'error');
        return;
      }
      
      loadCategoriesCache();
      await Promise.all([loadProducts(), loadServices(), loadOrders()]);
      switchTab('overview');
      startWebSocket();
    });
    
    function updateSidebarStatus() {
      const dot = document.getElementById('sidebar-status-dot');
      const text = document.getElementById('sidebar-status-text');
      if (currentShop.is_active) {
        dot.classList.remove('inactive');
        text.textContent = "Actif";
      } else {
        dot.classList.add('inactive');
        text.textContent = "Inactif";
      }
    }
    
    // 🆕 Charge les 2 listes de catégories en parallèle
    async function loadCategoriesCache() {
      try {
        const [prods, servs] = await Promise.all([
          CategoriesAPI.list('product'),
          CategoriesAPI.list('service'),
        ]);
        productCategories = prods || [];
        serviceCategories = servs || [];
      } catch (error) {
        console.error('Erreur chargement catégories:', error);
        productCategories = [];
        serviceCategories = [];
      }
    }
    
    function switchTab(tabName) {
      document.querySelectorAll('.sidebar-link').forEach(link => {
        link.classList.toggle('active', link.dataset.tab === tabName);
      });
      
      if (tabName !== 'shop') {
        destroyShopMap();
      }
      
      if (tabName === 'overview') renderOverview();
      else if (tabName === 'orders') {
        renderOrders();
        newOrdersCount = 0;
        updateOrdersBadge();
      } else if (tabName === 'products') renderProducts();
      else if (tabName === 'services') renderServices();
      else if (tabName === 'shop') renderShopSettings();
    }
    
    function renderOverview() {
      const totalSales = currentProducts.reduce((sum, p) => sum + p.sales_count, 0);
      const totalViews = currentProducts.reduce((sum, p) => sum + p.views_count, 0);
      const totalRevenue = currentOrders
        .filter(o => o.status === 'confirmed' || o.status === 'delivered')
        .reduce((sum, o) => sum + o.total_price, 0);
      const pendingOrders = currentOrders.filter(o => o.status === 'pending').length;
      
      const topProducts = [...currentProducts]
        .sort((a, b) => b.sales_count - a.sales_count)
        .slice(0, 5);
      
      const main = document.getElementById('dashboard-main');
      main.innerHTML = `
        <div class="dashboard-header">
          <h1>${t('seller.hello')} ${Auth.getUser().first_name || ''} 👋</h1>
          <p>${t('admin.subtitle')}</p>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card-icon">💰</div>
            <div class="stat-card-value">${formatPrice(totalRevenue)}</div>
            <div class="stat-card-label">${t('seller.revenue')}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">📦</div>
            <div class="stat-card-value">${totalSales}</div>
            <div class="stat-card-label">${t('seller.total_sales')}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">👁️</div>
            <div class="stat-card-value">${totalViews}</div>
            <div class="stat-card-label">${t('seller.product_views')}</div>
          </div>
          <div class="stat-card ${pendingOrders > 0 ? 'pending' : ''}">
            <div class="stat-card-icon">⏳</div>
            <div class="stat-card-value">${pendingOrders}</div>
            <div class="stat-card-label">${t('seller.pending')}</div>
          </div>
        </div>
        
        <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="stat-card">
            <h3 style="font-size:1.1rem;margin-bottom:12px;color:var(--brand-dark-solid);">${t('seller.top_products')}</h3>
            ${topProducts.length === 0 
              ? `<p style="color:var(--brand-dark-soft);font-size:0.9rem;">${t('seller.no_products')}</p>`
              : topProducts.map((p, i) => `
                <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--silver-soft);">
                  <span style="font-weight:800;color:var(--brand-dark-soft);">#${i+1}</span>
                  <div style="flex:1;min-width:0;">
                    <div style="font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brand-dark-solid);">${escapeHtml(p.name)}</div>
                    <div style="font-size:0.75rem;color:var(--brand-dark-soft);">${p.sales_count} ${t('product.sales').toLowerCase()}</div>
                  </div>
                  <div style="font-weight:700;color:var(--brand-dark-solid);font-size:0.85rem;">${formatPrice(p.price * p.sales_count)}</div>
                </div>
              `).join('')
            }
          </div>
          
          <div class="stat-card">
            <h3 style="font-size:1.1rem;margin-bottom:12px;color:var(--brand-dark-solid);">${t('seller.orders_by_status')}</h3>
            ${['pending','confirmed','delivered','cancelled'].map(status => {
              const count = currentOrders.filter(o => o.status === status).length;
              const labels = {
                pending: t('orders.pending'),
                confirmed: t('orders.confirmed'),
                delivered: t('orders.delivered'),
                cancelled: t('orders.cancelled'),
              };
              return `
                <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--silver-soft);">
                  <span style="font-size:0.9rem;color:var(--brand-dark-solid);">${labels[status]}</span>
                  <span style="font-weight:700;color:var(--brand-dark-solid);">${count}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
    
    async function loadOrders() {
      try {
        currentOrders = await OrdersAPI.getReceived();
        updateOrdersBadge();
      } catch (error) {
        console.error('Erreur chargement commandes:', error);
      }
    }
    
    function renderOrders() {
      const main = document.getElementById('dashboard-main');
      
      main.innerHTML = `
        <div class="dashboard-header">
          <h1>${t('seller.orders_received')}</h1>
          <p>${t('seller.orders_received_p')}</p>
        </div>
        
        <div class="orders-list" id="orders-container">
          ${currentOrders.length === 0 
            ? `<div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <h3>${t('seller.no_orders')}</h3>
                <p>${t('seller.no_orders_p')}</p>
              </div>`
            : currentOrders.map(order => renderOrderCard(order)).join('')
          }
        </div>
      `;
    }
    
    function renderOrderCard(order) {
      const statusLabels = {
        pending: { text: t('orders.status_pending'), class: 'badge-warning' },
        confirmed: { text: t('orders.status_confirmed'), class: 'badge-blue' },
        delivered: { text: t('orders.status_delivered'), class: 'badge-success' },
        cancelled: { text: t('orders.status_cancelled'), class: 'badge-danger' },
      };
      const status = statusLabels[order.status] || statusLabels.pending;
      
      return `
        <div class="order-card ${order.status === 'pending' ? 'new' : ''}" data-order-id="${order.id}">
          <div class="order-info">
            <div class="order-icon">${order.status === 'pending' ? '🔔' : '📦'}</div>
            <div class="order-details">
              <div class="order-title">${t('orders.order_id')} #${order.id} — ${escapeHtml(order.product?.name || t('seller.product'))}</div>
              <div class="order-meta">
                <span class="badge ${status.class}">${status.text}</span>
                <span>📅 ${formatDate(order.created_at)}</span>
                <span>📞 ${escapeHtml(order.buyer?.phone || '—')}</span>
                ${order.buyer?.first_name ? `<span>👤 ${escapeHtml(order.buyer.first_name)}</span>` : ''}
              </div>
              ${order.note ? `<div style="margin-top:8px;font-size:0.85rem;color:var(--brand-dark-soft);padding:8px;background:rgba(255, 253, 209, 0.85);border-radius:6px;border:1px solid var(--silver-soft);">💬 ${escapeHtml(order.note)}</div>` : ''}
            </div>
          </div>
          <div class="order-actions">
            <div class="order-price">${formatPrice(order.total_price)}</div>
            ${order.status === 'pending' ? `
              <button class="btn btn-primary btn-sm" onclick="updateOrderStatus(${order.id}, 'confirmed')">${t('seller.confirm')}</button>
              <button class="btn btn-danger btn-sm" onclick="updateOrderStatus(${order.id}, 'cancelled')">${t('seller.cancel')}</button>
            ` : ''}
            ${order.status === 'confirmed' ? `
              <button class="btn btn-primary btn-sm" onclick="updateOrderStatus(${order.id}, 'delivered')">${t('seller.deliver')}</button>
            ` : ''}
          </div>
        </div>
      `;
    }
    
    async function updateOrderStatus(orderId, newStatus) {
      try {
        await OrdersAPI.updateStatus(orderId, newStatus);
        showToast('✅', 'success');
        await loadOrders();
        await loadProducts();
        renderOrders();
        renderOverview();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }
    
    function updateOrdersBadge() {
      const badge = document.getElementById('orders-badge');
      if (!badge) return;
      
      if (newOrdersCount > 0) {
        badge.textContent = newOrdersCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }
    
    async function loadProducts() {
      try {
        currentProducts = await ProductsAPI.getMine();
      } catch (error) {
        console.error('Erreur chargement produits:', error);
      }
    }
    
    function renderProducts() {
      const main = document.getElementById('dashboard-main');
      
      main.innerHTML = `
        <div class="dashboard-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
          <div>
            <h1>${t('seller.my_products')}</h1>
            <p>${currentProducts.length} ${t('seller.my_products_p')}</p>
          </div>
          <button class="btn btn-primary" onclick="openProductModal()">
            ${t('seller.add_product')}
          </button>
        </div>
        
        ${currentProducts.length === 0 
          ? `<div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <h3>${t('seller.no_products')}</h3>
              <p>${t('seller.no_products_p')}</p>
              <button class="btn btn-primary mt-16" onclick="openProductModal()">${t('seller.add_product')}</button>
            </div>`
          : `<div class="products-grid-admin">
              ${currentProducts.map(p => renderAdminProductCard(p)).join('')}
            </div>`
        }
        
        <div id="product-modal" class="hidden"></div>
      `;
    }
    
    async function loadServices() {
      try {
        currentServices = await ServicesAPI.getMine();
      } catch (error) {
        console.error('Erreur chargement services:', error);
      }
    }

    function renderServices() {
      const main = document.getElementById('dashboard-main');
      
      main.innerHTML = `
        <div class="dashboard-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
          <div>
            <h1>Mes Services</h1>
            <p>${currentServices.length} service(s) proposé(s)</p>
          </div>
          <button class="btn btn-primary" onclick="openServiceModal()">
            ➕ Ajouter un service
          </button>
        </div>
        
        ${currentServices.length === 0 
          ? `<div class="empty-state">
              <div class="empty-state-icon">🛠️</div>
              <h3>Aucun service pour l'instant</h3>
              <p>Ajoutez votre premier service pour commencer.</p>
              <button class="btn btn-primary mt-16" onclick="openServiceModal()">Ajouter un service</button>
            </div>`
          : `<div class="products-grid-admin">
              ${currentServices.map(s => renderAdminServiceCard(s)).join('')}
            </div>`
        }
        
        <div id="service-modal" class="hidden"></div>
      `;
    }

    function renderAdminServiceCard(service) {
      return `
        <div class="admin-product-card">
          <div class="admin-product-image">
            ${service.photo_url 
              ? `<img src="${imageUrl(service.photo_url)}" alt="${escapeHtml(service.name)}">`
              : '🛠️'}
          </div>
          <div class="admin-product-body">
            <div class="admin-product-name">${escapeHtml(service.name)}</div>
            ${service.category ? `<div class="admin-product-category">${escapeHtml(service.category)}</div>` : ''}
            <div class="admin-product-price">${service.is_price_fixed ? formatPrice(service.price) : 'Prix variable'}</div>
            <div class="admin-product-stats">
              <span>📍 ${escapeHtml(service.service_area || 'Zone non définie')}</span>
            </div>
            <div class="admin-product-actions">
              <button class="btn btn-ghost btn-sm" onclick="openServiceModal(${service.id})">Éditer</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteService(${service.id})" style="color:var(--danger);">🗑️</button>
            </div>
          </div>
        </div>
      `;
    }

    // Modal Service
    function openServiceModal(serviceId = null) {
      editingServiceId = serviceId;
      serviceImageFile = null;
      serviceVideoFile = null;
      
      let service = {
        name: '', description: '', price: '', category: '', service_area: '', availability_info: '', is_price_fixed: true
      };
      
      if (serviceId) {
        service = currentServices.find(s => s.id === serviceId);
      }
      
      const isEdit = !!serviceId;
      const modal = document.getElementById('service-modal');
      
      modal.innerHTML = `
        <div class="modal-overlay" onclick="closeServiceModal(event)">
          <div class="modal" style="max-width:600px;" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h3>${isEdit ? '✏️ Modifier le service' : '➕ Ajouter un service'}</h3>
              <button class="modal-close" onclick="closeServiceModal()">✕</button>
            </div>
            
            <div class="modal-body">
              <div id="service-error" class="alert alert-error hidden"></div>
              
              <div class="form-group">
                <label class="form-label required">Nom du service</label>
                <input type="text" class="form-input" id="s-name" value="${escapeHtml(service.name)}">
              </div>
              
              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-textarea" id="s-desc">${escapeHtml(service.description || '')}</textarea>
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Prix (FCFA)</label>
                  <input type="number" class="form-input" id="s-price" value="${service.price}" placeholder="0">
                </div>
                <div class="form-group">
                  <label class="form-label">Prix fixe ?</label>
                  <select class="form-input" id="s-price-fixed">
                    <option value="true" ${service.is_price_fixed ? 'selected' : ''}>Oui</option>
                    <option value="false" ${!service.is_price_fixed ? 'selected' : ''}>Non (Négociable)</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Catégorie (service)</label>
                  <div class="category-input-wrapper">
                    <input 
                      type="text" 
                      class="form-input" 
                      id="s-category" 
                      value="${escapeHtml(service.category || '')}"
                      placeholder="Ex: Beauty & Personal Care"
                      autocomplete="off"
                    >
                    <div class="category-suggestions" id="s-category-suggestions"></div>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Zone d'intervention</label>
                  <input type="text" class="form-input" id="s-area" value="${escapeHtml(service.service_area || '')}" placeholder="Ex: Cotonou, Fidjrossè">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Disponibilité / Horaires</label>
                <input type="text" class="form-input" id="s-availability" value="${escapeHtml(service.availability_info || '')}" placeholder="Ex: Sur rendez-vous, Lun-Sam 9h-18h">
              </div>
              
              <div class="form-group">
                <label class="form-label">Photo</label>
                <div class="image-upload" onclick="document.getElementById('s-image').click()">
                  <input type="file" id="s-image" accept="image/jpeg,image/png,image/webp" onchange="handleServiceImage(event)">
                  <div id="s-image-preview">
                    ${service.photo_url 
                      ? `<img src="${imageUrl(service.photo_url)}" class="image-preview">`
                      : `<div style="color:var(--brand-dark-soft);">📸 Cliquez pour ajouter une photo</div>`}
                  </div>
                </div>
              </div>
            </div>
            
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeServiceModal()">Annuler</button>
              <button class="btn btn-primary" id="save-service-btn" onclick="saveService()">
                ${isEdit ? 'Modifier' : 'Ajouter'}
              </button>
            </div>
          </div>
        </div>
      `;
      
      modal.classList.remove('hidden');
      
      // 🆕 Autocomplete services après ouverture du modal
      setTimeout(() => {
        initCategoryAutocomplete('s-category', 's-category-suggestions', 'service');
      }, 50);
    }

    function closeServiceModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('service-modal').classList.add('hidden');
      editingServiceId = null;
    }

    function handleServiceImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      serviceImageFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('s-image-preview').innerHTML = `<img src="${e.target.result}" class="image-preview">`;
      };
      reader.readAsDataURL(file);
    }

    async function saveService() {
      const btn = document.getElementById('save-service-btn');
      const errorDiv = document.getElementById('service-error');
      
      const data = {
        name: document.getElementById('s-name').value.trim(),
        description: document.getElementById('s-desc').value.trim() || null,
        price: parseFloat(document.getElementById('s-price').value) || 0,
        is_price_fixed: document.getElementById('s-price-fixed').value === 'true',
        category: document.getElementById('s-category').value.trim() || null,

    // 🆕 Autocomplete générique (filtre par type)
    function initCategoryAutocomplete(inputId = 'p-category', suggestionsId = 'p-category-suggestions', type = 'product') {
      const input = document.getElementById(inputId);
      const suggestions = document.getElementById(suggestionsId);
      if (!input || !suggestions) return;
      
      // 🆕 Choisir la bonne liste selon le type
      const sourceCategories = type === 'service' ? serviceCategories : productCategories;
      
      function renderSuggestions(filter = '') {
        const q = filter.toLowerCase().trim();
        
        const filtered = sourceCategories.filter(c => 
          c.name.toLowerCase().includes(q) ||
          (c.description && c.description.toLowerCase().includes(q))
        );
        
        if (filtered.length === 0) {
          suggestions.innerHTML = `<div class="category-suggestions-empty">Aucune catégorie</div>`;
          suggestions.classList.add('open');
          return;
        }
        
        suggestions.innerHTML = filtered.slice(0, 10).map(c => `
          <div class="category-suggestion-item" data-name="${escapeHtml(c.name)}">
            <span class="category-suggestion-emoji">${c.emoji || '🏷️'}</span>
            <div class="category-suggestion-info">
              <div class="category-suggestion-name">${escapeHtml(c.name)}</div>
              ${c.description ? `<div class="category-suggestion-desc">${escapeHtml(c.description)}</div>` : ''}
            </div>
          </div>
        `).join('');
        
        suggestions.classList.add('open');
        
        suggestions.querySelectorAll('.category-suggestion-item').forEach(item => {
          item.addEventListener('click', () => {
            input.value = item.dataset.name;
            suggestions.classList.remove('open');
          });
        });
      }
      
      input.addEventListener('focus', () => renderSuggestions(input.value));
      input.addEventListener('input', () => renderSuggestions(input.value));
      
      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !suggestions.contains(e.target)) {
          suggestions.classList.remove('open');
        }
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') suggestions.classList.remove('open');
        if (e.key === 'Enter') {
          e.preventDefault();
          const first = suggestions.querySelector('.category-suggestion-item');
          if (first && suggestions.classList.contains('open')) {
            input.value = first.dataset.name;
            suggestions.classList.remove('open');
          }
        }
      });
    }

    async function saveProduct() {
      const btn = document.getElementById('save-product-btn');
      const errorDiv = document.getElementById('product-error');
      
      errorDiv.classList.add('hidden');
      
      const data = {
        name: document.getElementById('p-name').value.trim(),
        description: document.getElementById('p-desc').value.trim() || null,
        price: parseFloat(document.getElementById('p-price').value) || 0,
        is_price_fixed: document.getElementById('p-price-fixed').value === 'true',
        category: document.getElementById('p-category').value.trim() || null,
        color: document.getElementById('p-color').value.trim() || null,
        availability: document.getElementById('p-availability').value,
        stock_quantity: document.getElementById('p-stock').value.trim() || null,
      };
      
      if (!data.name) {
        errorDiv.textContent = '—';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (data.is_price_fixed && (!data.price || data.price <= 0)) {
        errorDiv.textContent = 'Le prix est requis si fixe.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      
      try {
        let product;
        
        if (editingProductId) {
          product = await ProductsAPI.update(editingProductId, data);
          
          if (productImageFile) {
            product = await ProductsAPI.uploadPhoto(editingProductId, productImageFile);
          }
          if (productVideoFile) {
            product = await ProductsAPI.uploadVideo(editingProductId, productVideoFile);
          }
          
          showToast('✅', 'success');
        } else {
          product = await ProductsAPI.create(data);
          
          if (productImageFile) {
            product = await ProductsAPI.uploadPhoto(product.id, productImageFile);
          }
          if (productVideoFile) {
            product = await ProductsAPI.uploadVideo(product.id, productVideoFile);
          }
          
          showToast('✅', 'success');
        }
        
        closeProductModal();
        await loadProducts();
        renderProducts();
        renderOverview();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = editingProductId ? t('seller.edit') : t('seller.add_product');
      }
    }

    function startWebSocket() {
      const token = Auth.getToken();
      if (!token) return;
      
      const isLocal = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1';
      
      const API_HOST = isLocal ? '127.0.0.1:8000' : 'finest-global-api.onrender.com';
      const WS_PROTOCOL = isLocal ? 'ws' : 'wss';
      
      const wsUrl = `${WS_PROTOCOL}://${API_HOST}/ws/notifications?token=${token}`;
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => console.log('🟢 WebSocket connecté');
      
      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          
          if (message.type === 'new_order') {
            handleNewOrder(message.order);
          }
        } catch (error) {
          console.error('Erreur WebSocket:', error);
        }
      };
      
      ws.onerror = (error) => console.error('WebSocket erreur:', error);
      
      ws.onclose = () => {
        setTimeout(startWebSocket, 3000);
      };
    }
    
    async function handleNewOrder(orderData) {
      showToast(
        `🔔 ${t('seller.new_order')} : ${orderData.product_name} (${orderData.quantity}x)`,
        'orange',
        8000
      );
      
      newOrdersCount++;
      updateOrdersBadge();
      
      await loadOrders();
      
      const activeTab = document.querySelector('.sidebar-link.active')?.dataset.tab;
      if (activeTab === 'orders') renderOrders();
      else if (activeTab === 'overview') renderOverview();
    }
  </script>
</body>
</html>
