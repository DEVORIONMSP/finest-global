<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Connexion — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--blue-50) 0%, var(--white) 100%);
    }
    
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    
    .auth-header p {
      color: var(--gray-500);
      font-size: 0.95rem;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--gray-500);
    }
    
    .auth-footer a {
      color: var(--blue-700);
      font-weight: 600;
    }
    
    @media (max-width: 640px) {
      .auth-page {
        padding: 24px 14px;
        min-height: calc(100vh - 60px);
      }
      
      .auth-card {
        padding: 28px 22px;
        border-radius: var(--radius);
      }
      
      .auth-header { margin-bottom: 24px; }
      .auth-header h1 { font-size: 1.4rem; }
      .auth-header p { font-size: 0.88rem; }
      .form-label { font-size: 0.85rem; }
      
      .form-input {
        padding: 11px 14px;
        font-size: 0.92rem;
      }
      
      .btn-lg {
        padding: 13px 20px;
        font-size: 0.92rem;
      }
      
      .auth-footer {
        margin-top: 20px;
        font-size: 0.85rem;
      }
    }
    
    @media (max-width: 380px) {
      .auth-card { padding: 24px 18px; }
      .auth-header h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="auth-page">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1 data-i18n="login.title">Bon retour 👋</h1>
        <p data-i18n="login.subtitle">Connectez-vous à votre compte Finest Global</p>
      </div>
      
      <form id="login-form" onsubmit="login(event)">
        <div id="login-error" class="alert alert-error hidden"></div>
        
        <div class="form-group">
          <label class="form-label required" data-i18n="login.phone">Numéro de téléphone</label>
          <input 
            type="tel" 
            class="form-input" 
            id="login-phone"
            placeholder="01 XX XX XX XX"
            maxlength="10"
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label required" data-i18n="login.password">Mot de passe</label>
          <input 
            type="password" 
            class="form-input" 
            id="login-password"
            placeholder="••••••••"
            required
          >
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login" data-i18n="login.submit">
          Se connecter
        </button>
      </form>
      
      <div class="auth-footer">
        <span data-i18n="login.no_account">Pas encore de compte ?</span>
        <a href="/register.html" data-i18n="login.signup_link">S'inscrire</a>
      </div>
      
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();
      
      if (Auth.isAuthenticated()) {
        redirectAfterLogin();
      }
      
      // Auto-remplir le téléphone si passé en paramètre URL
      const urlParams = new URLSearchParams(window.location.search);
      const phone = urlParams.get('phone');
      if (phone) {
        document.getElementById('login-phone').value = phone;
      }
    });
    
    async function login(event) {
      event.preventDefault();
      
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      
      errorDiv.classList.add('hidden');
      
      // Validation
      if (phone.length !== 10 || !phone.startsWith('01')) {
        errorDiv.textContent = t('register.phone_hint');
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (!password) {
        errorDiv.textContent = t('login.password');
        errorDiv.classList.remove('hidden');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      
      try {
        const data = await UsersAPI.login(phone, password);
        Auth.setSession(data.access_token, data.user);
        showToast('✅', 'success');
        setTimeout(redirectAfterLogin, 500);
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = t('login.submit');
      }
    }
    
    function redirectAfterLogin() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      
      if (redirect) {
        window.location.href = redirect;
        return;
      }
      
      const user = Auth.getUser();
      if (user.role === 'admin') {
        window.location.href = '/dashboard-admin.html';
      } else if (user.role === 'seller') {
        window.location.href = '/dashboard-seller.html';
      } else {
        window.location.href = '/index.html';
      }
    }
  </script>
</body>
</html>
