<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Connexion — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    :root {
      --brand-dark:        rgba(58, 22, 6, 0.92);
      --brand-dark-solid:  #3A1606;
      --brand-dark-deep:   #2A0F03;
      --brand-dark-soft:   rgba(58, 22, 6, 0.75);
      --silver:            rgb(170, 169, 173);
      --silver-light:      rgba(170, 169, 173, 0.45);
      --silver-soft:       rgba(170, 169, 173, 0.2);
      --cream:             rgb(255, 253, 209);
      --cream-card:        rgba(255, 253, 209, 0.55);
      --cream-soft:        rgba(255, 253, 209, 0.88);
      --cream-muted:       rgba(255, 253, 209, 0.7);
    }

    .auth-page {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--brand-dark-deep) 0%, var(--brand-dark-solid) 55%, var(--brand-dark) 100%);
      position: relative;
      overflow: hidden;
    }
    
    .auth-page::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,253,209,0.10) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .auth-page::after {
      content: "";
      position: absolute;
      bottom: -200px;
      left: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(170,169,173,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--cream);
      border-radius: var(--radius-lg, 14px);
      box-shadow: 0 24px 64px rgba(42, 15, 3, 0.4);
      padding: 40px;
      border: 1.5px solid var(--silver);
      position: relative;
      z-index: 1;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: var(--brand-dark-solid);
    }
    
    .auth-header p {
      color: var(--brand-dark-soft);
      font-size: 0.95rem;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--brand-dark-soft);
    }
    
    .auth-footer a {
      color: var(--brand-dark-solid);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: var(--silver);
    }
    
    .auth-footer a:hover {
      color: var(--brand-dark-deep);
    }
    
    /* Inputs */
    .form-input {
      background: rgba(255, 253, 209, 0.85);
      border: 1.5px solid var(--silver);
      color: var(--brand-dark-solid);
      border-radius: var(--radius, 10px);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--brand-dark-solid);
      background: var(--cream);
      box-shadow: 0 0 0 3px rgba(58, 22, 6, 0.15);
    }
    
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--brand-dark-solid);
      margin-bottom: 6px;
      display: block;
    }
    
    /* Bouton primaire */
    .btn-primary {
      background: var(--brand-dark-solid);
      color: var(--cream);
      border: 1.5px solid var(--brand-dark-solid);
    }
    
    .btn-primary:hover {
      background: var(--brand-dark-deep);
      border-color: var(--brand-dark-deep);
      color: var(--cream);
    }
    
    /* Alertes */
    .alert-error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      padding: 12px 16px;
      border-radius: var(--radius, 10px);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    
    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 253, 209, 0.3);
      border-top-color: var(--cream);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media (max-width: 640px) {
      .auth-page {
        padding: 24px 14px;
        min-height: calc(100vh - 60px);
      }
      
      .auth-card {
        padding: 28px 22px;
        border-radius: var(--radius, 10px);
      }
      
      .auth-header { margin-bottom: 24px; }
      .auth-header h1 { font-size: 1.4rem; }
      .auth-header p { font-size: 0.88rem; }
      .form-label { font-size: 0.85rem; }
      
      .form-input {
        padding: 11px 14px;
        font-size: 0.92rem;
      }
      
      .btn-lg {
        padding: 13px 20px;
        font-size: 0.92rem;
      }
      
      .auth-footer {
        margin-top: 20px;
        font-size: 0.85rem;
      }
    }
    
    @media (max-width: 380px) {
      .auth-card { padding: 24px 18px; }
      .auth-header h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="auth-page">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1 data-i18n="login.title">Bon retour 👋</h1>
        <p data-i18n="login.subtitle">Connectez-vous à votre compte Finest Global</p>
      </div>
      
      <form id="login-form" onsubmit="login(event)">
        <div id="login-error" class="alert alert-error hidden"></div>
        
        <div class="form-group">
          <label class="form-label required" data-i18n="login.phone">Numéro de téléphone</label>
          <input 
            type="tel" 
            class="form-input" 
            id="login-phone"
            placeholder="01 XX XX XX XX"
            maxlength="10"
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label required" data-i18n="login.password">Mot de passe</label>
          <input 
            type="password" 
            class="form-input" 
            id="login-password"
            placeholder="••••••••"
            required
          >
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login" data-i18n="login.submit">
          Se connecter
        </button>
      </form>
      
      <div class="auth-footer">
        <span data-i18n="login.no_account">Pas encore de compte ?</span>
        <a href="/register.html" data-i18n="login.signup_link">S'inscrire</a>
      </div>
      
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();
      
      if (Auth.isAuthenticated()) {
        redirectAfterLogin();
      }
      
      const urlParams = new URLSearchParams(window.location.search);
      const phone = urlParams.get('phone');
      if (phone) {
        document.getElementById('login-phone').value = phone;
      }
    });
    
    async function login(event) {
      event.preventDefault();
      
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      
      errorDiv.classList.add('hidden');
      
      if (phone.length !== 10 || !phone.startsWith('01')) {
        errorDiv.textContent = t('register.phone_hint');
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (!password) {
        errorDiv.textContent = t('login.password');
        errorDiv.classList.remove('hidden');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      
      try {
        const data = await UsersAPI.login(phone, password);
        Auth.setSession(data.access_token, data.user);
        showToast('✅', 'success');
        setTimeout(redirectAfterLogin, 500);
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = t('login.submit');
      }
    }
    
    function redirectAfterLogin() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      
      if (redirect) {
        window.location.href = redirect;
        return;
      }
      
      const user = Auth.getUser();
      if (user.role === 'admin') {
        window.location.href = '/dashboard-admin.html';
      } else if (user.role === 'seller') {
        window.location.href = '/dashboard-seller.html';
      } else {
        window.location.href = '/index.html';
      }
    }
  </script>
</body>
</html>
