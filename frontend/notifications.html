<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Notifications — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    :root {
      --brand-dark:        rgba(58, 22, 6, 0.92);
      --brand-dark-solid:  #3A1606;
      --brand-dark-deep:   #2A0F03;
      --brand-dark-soft:   rgba(58, 22, 6, 0.75);
      --silver:            rgb(170, 169, 173);
      --silver-light:      rgba(170, 169, 173, 0.45);
      --silver-soft:       rgba(170, 169, 173, 0.2);
      --cream:             rgb(255, 253, 209);
      --cream-card:        rgba(255, 253, 209, 0.55);
      --cream-soft:        rgba(255, 253, 209, 0.88);
      --cream-muted:       rgba(255, 253, 209, 0.7);
      --danger:            #DC2626;
      --success:           #10B981;
    }

    .notifications-page {
      min-height: calc(100vh - 70px);
      background: var(--cream);
      padding: 40px 0 60px;
    }
    
    .notifications-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .notifications-header h1 {
      font-size: 1.75rem;
      color: var(--brand-dark-solid);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    
    .notifications-header p {
      color: var(--brand-dark-soft);
      font-size: 0.95rem;
    }

    .mark-all-btn {
      background: var(--cream-card);
      border: 1.5px solid var(--silver);
      color: var(--brand-dark-solid);
      padding: 10px 20px;
      border-radius: var(--radius, 10px);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .mark-all-btn:hover {
      background: rgba(255, 253, 209, 0.95);
      border-color: var(--brand-dark-solid);
    }

    .notifications-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notification-card {
      background: var(--cream-card);
      border: 1.5px solid var(--silver);
      border-radius: var(--radius-lg, 14px);
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .notification-card:hover {
      border-color: var(--brand-dark-solid);
      box-shadow: 0 8px 24px rgba(58, 22, 6, 0.1);
    }

    .notification-card.unread {
      background: rgba(255, 253, 209, 0.95);
      border-left: 4px solid var(--brand-dark-solid);
    }

    .notification-card.read {
      opacity: 0.75;
    }

    .notif-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(170, 169, 173, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      border: 1px solid var(--silver-light);
    }

    .notif-content {
      flex: 1;
      min-width: 0;
    }

    .notif-content h3 {
      font-size: 1rem;
      color: var(--brand-dark-solid);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .notif-content p {
      font-size: 0.9rem;
      color: var(--brand-dark-soft);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .notif-date {
      font-size: 0.75rem;
      color: var(--silver);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .notif-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      align-items: flex-end;
    }

    .notif-link-btn {
      background: var(--brand-dark-solid);
      color: var(--cream);
      border: 1.5px solid var(--brand-dark-solid);
      padding: 6px 12px;
      border-radius: var(--radius-sm, 6px);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .notif-link-btn:hover {
      background: var(--brand-dark-deep);
    }

    .notif-toggle-btn {
      background: transparent;
      border: 1.5px solid var(--silver);
      color: var(--brand-dark-soft);
      padding: 4px 10px;
      border-radius: var(--radius-sm, 6px);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .notif-toggle-btn:hover {
      border-color: var(--brand-dark-solid);
      color: var(--brand-dark-solid);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      background: var(--cream-card);
      border: 1.5px dashed var(--silver);
      border-radius: var(--radius-lg, 14px);
    }
    .empty-state-icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state h3 {
      color: var(--brand-dark-solid);
      margin-bottom: 8px;
      font-size: 1.2rem;
    }
    .empty-state p {
      color: var(--brand-dark-soft);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .loading-container {
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }
    .spinner-blue {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(58, 22, 6, 0.2);
      border-top-color: var(--brand-dark-solid);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .notifications-page { padding: 20px 0 40px; }
      .notifications-header h1 { font-size: 1.4rem; }
      .notifications-header p { font-size: 0.85rem; }
      
      .notification-card {
        padding: 16px;
        flex-direction: column;
        gap: 12px;
      }
      
      .notif-actions {
        flex-direction: row;
        align-items: center;
        width: 100%;
        justify-content: flex-end;
      }

      .notif-icon-box {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }

      .notif-content h3 { font-size: 0.95rem; }
      .notif-content p { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="notifications-page">
    <div class="container">
      
      <div class="notifications-header">
        <div>
          <h1>🔔 Notifications</h1>
          <p>Restez informé de l'activité de votre compte.</p>
        </div>
        <button class="mark-all-btn" onclick="markAllRead()">
          ✓ Tout marquer comme lu
        </button>
      </div>

      <div id="loading" class="loading-container">
        <span class="spinner-blue"></span>
      </div>

      <div id="notifications-list" class="notifications-list hidden"></div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let allNotifications = [];

    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar();
      
      if (!Auth.requireAuth()) return;
      
      await loadNotifications();
    });

    async function loadNotifications() {
      try {
        allNotifications = await NotificationsAPI.getMine();
        renderNotifications();
      } catch (error) {
        showToast(error.message, 'error');
        document.getElementById('loading').innerHTML = `<p style="color:var(--brand-dark-solid);">Erreur de chargement.</p>`;
      }
    }

    function renderNotifications() {
      document.getElementById('loading').classList.add('hidden');
      const container = document.getElementById('notifications-list');
      container.classList.remove('hidden');

      if (allNotifications.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>Aucune notification</h3>
            <p>Vous n'avez pas encore de notifications pour le moment.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = allNotifications.map(n => {
        // Choisir l'icône selon le type
        let icon = '🔔';
        if (n.type === 'new_order') icon = '📦';
        else if (n.type === 'order_status_changed') icon = '🚚';
        else if (n.type === 'system') icon = '⚙️';

        return `
          <div class="notification-card ${n.is_read ? 'read' : 'unread'}">
            <div class="notif-icon-box">${icon}</div>
            
            <div class="notif-content">
              <h3>${escapeHtml(n.title)}</h3>
              <p>${escapeHtml(n.message)}</p>
              <div class="notif-date">${formatDate(n.created_at)}</div>
            </div>

            <div class="notif-actions">
              ${n.link ? `<a href="${n.link}" class="notif-link-btn">Voir →</a>` : ''}
              <button class="notif-toggle-btn" onclick="toggleReadStatus(${n.id}, ${!n.is_read})">
                ${n.is_read ? 'Marquer non lu' : 'Marquer lu'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleReadStatus(id, newStatus) {
      try {
        await NotificationsAPI.markRead(id, newStatus);
        // Mettre à jour localement
        const notif = allNotifications.find(n => n.id === id);
        if (notif) notif.is_read = newStatus;
        renderNotifications();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function markAllRead() {
      try {
        await NotificationsAPI.markAllRead();
        allNotifications.forEach(n => n.is_read = true);
        renderNotifications();
        showToast('✅ Tout a été marqué comme lu', 'success');
      } catch (error) {
        showToast(error.message, 'error');
      }
    }
  </script>
</body>
</html>
