
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Boutique — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .shop-page {
      min-height: calc(100vh - 70px);
      background: var(--gray-50);
    }
    
    .shop-hero {
      background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-700) 100%);
      color: var(--white);
      padding: 60px 0;
      position: relative;
      overflow: hidden;
    }
    
    .shop-hero::before {
      content: "";
      position: absolute;
      top: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,138,61,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .shop-hero-inner {
      display: flex;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 1;
    }
    
    .shop-hero-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--white);
      color: var(--blue-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 2rem;
      flex-shrink: 0;
      border: 4px solid rgba(255,255,255,0.2);
    }
    
    .shop-hero-info h1 {
      color: var(--white);
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .shop-hero-info p {
      color: rgba(255,255,255,0.85);
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    
    /* Code boutique */
    .shop-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .shop-code-badge:hover {
      background: rgba(255,255,255,0.25);
    }
    
    .shop-code-badge .code {
      color: var(--orange-400);
      letter-spacing: 1px;
    }
    
    .shop-hero-stats {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }
    
    .shop-hero-stats span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.9);
    }
    
    .shop-toolbar {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 16px 0;
      position: sticky;
      top: 70px;
      z-index: 40;
    }
    
    .shop-toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .shop-toolbar h2 {
      font-size: 1.1rem;
      color: var(--blue-900);
    }
    
    .sort-select {
      padding: 8px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 0.9rem;
      background: var(--white);
      color: var(--gray-700);
      font-weight: 600;
      cursor: pointer;
    }
    
    .products-section { padding: 40px 0 60px; }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }
    
    .product-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--transition);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }
    
    .product-card:hover {
      border-color: var(--blue-500);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }
    
    .product-image {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--blue-50), var(--gray-100));
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--gray-500);
    }
    
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .product-badge-sales {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--orange-500);
      color: var(--white);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    
    .product-badge-availability {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .availability-in_stock { background: #D1FAE5; color: #065F46; }
    .availability-out_of_stock { background: #FEE2E2; color: #991B1B; }
    .availability-to_confirm { background: #FEF3C7; color: #92400E; }
    
    .product-info {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .product-name {
      font-weight: 700;
      color: var(--blue-900);
      font-size: 0.95rem;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.4em;
    }
    
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }
    
    .product-price {
      font-weight: 800;
      color: var(--orange-600);
      font-size: 1rem;
    }
    
    .product-detail { padding: 40px 0 60px; }
    
    .product-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 32px;
      border: 1.5px solid var(--gray-200);
    }
    
    .product-detail-image {
      aspect-ratio: 1;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--blue-50), var(--gray-100));
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      color: var(--gray-500);
      position: relative;
    }
    
    .product-detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .product-detail-info h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: var(--blue-900);
      letter-spacing: -0.5px;
    }
    
    .product-detail-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    
    .product-detail-price {
      font-size: 2rem;
      font-weight: 900;
      color: var(--orange-600);
      margin-bottom: 24px;
      letter-spacing: -1px;
    }
    
    .product-detail-desc {
      color: var(--gray-700);
      line-height: 1.7;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--gray-200);
    }
    
    .product-detail-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-box {
      background: var(--gray-50);
      padding: 14px;
      border-radius: var(--radius);
      text-align: center;
    }
    
    .stat-value {
      font-weight: 800;
      color: var(--blue-900);
      font-size: 1.25rem;
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .product-seller {
      background: var(--blue-50);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .product-seller-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--blue-700);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }
    
    .product-seller-info { flex: 1; }
    .product-seller-name {
      font-weight: 700;
      color: var(--blue-900);
    }
    .product-seller-label {
      font-size: 0.8rem;
      color: var(--gray-500);
    }
    
    .qty-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .qty-selector label {
      font-weight: 600;
      color: var(--gray-700);
    }
    
    .qty-controls {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      overflow: hidden;
    }
    
    .qty-btn {
      padding: 10px 16px;
      background: var(--gray-50);
      font-weight: 700;
      color: var(--gray-700);
      transition: background var(--transition);
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    
    .qty-btn:hover { background: var(--gray-100); }
    
    .qty-value {
      padding: 10px 20px;
      font-weight: 700;
      min-width: 50px;
      text-align: center;
    }
    
    .similar-section { margin-top: 60px; }
    
    .similar-section h2 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      color: var(--blue-900);
    }
    
    .order-summary {
      background: var(--blue-50);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    
    .order-summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
    }
    
    .order-summary-row.total {
      border-top: 2px solid var(--blue-200);
      margin-top: 8px;
      padding-top: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--blue-900);
    }
    
    @media (max-width: 900px) {
      .product-detail-grid { grid-template-columns: 1fr; gap: 24px; padding: 20px; }
      .shop-hero-inner { flex-direction: column; text-align: center; }
      .shop-hero-stats { justify-content: center; }
      .shop-hero-info h1 { font-size: 1.5rem; }
    }
    
    @media (max-width: 640px) {
      .shop-hero { padding: 36px 0; }
      .shop-hero-inner { flex-direction: column; text-align: center; gap: 16px; padding: 0 16px; }
      .shop-hero-avatar { width: 72px; height: 72px; font-size: 1.6rem; border-width: 3px; }
      .shop-hero-info h1 { font-size: 1.35rem; margin-bottom: 6px; }
      .shop-hero-info p { font-size: 0.88rem; line-height: 1.5; margin-bottom: 10px; }
      .shop-hero-stats { justify-content: center; gap: 14px; font-size: 0.8rem; flex-wrap: wrap; }
      .shop-toolbar { top: 60px; padding: 12px 0; }
      .shop-toolbar-inner { flex-direction: column; gap: 10px; align-items: stretch; }
      .shop-toolbar h2 { font-size: 0.95rem; text-align: center; }
      .sort-select { width: 100%; padding: 9px 12px; font-size: 0.85rem; }
      .products-section { padding: 20px 0 40px; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .product-info { padding: 10px; }
      .product-name { font-size: 0.85rem; min-height: 2.6em; margin-bottom: 6px; }
      .product-price { font-size: 0.9rem; }
      .product-badge-sales { padding: 3px 8px; font-size: 0.65rem; top: 8px; left: 8px; }
      .product-badge-availability { padding: 3px 8px; font-size: 0.6rem; top: 8px; right: 8px; }
      .product-detail { padding: 20px 0 40px; }
      .product-detail-grid { padding: 16px; gap: 18px; border-radius: var(--radius); }
      .product-detail-image { font-size: 4rem; }
      .product-detail-info h1 { font-size: 1.25rem; margin-bottom: 10px; }
      .product-detail-meta { gap: 8px; margin-bottom: 14px; }
      .product-detail-meta .badge { font-size: 0.7rem; padding: 4px 10px; }
      .product-detail-price { font-size: 1.6rem; margin-bottom: 18px; }
      .product-detail-desc { font-size: 0.9rem; line-height: 1.6; margin-bottom: 18px; padding-bottom: 18px; }
      .product-detail-stats { gap: 10px; margin-bottom: 18px; }
      .stat-box { padding: 10px 8px; }
      .stat-value { font-size: 1.05rem; }
      .stat-label { font-size: 0.65rem; }
      .product-seller { padding: 12px; margin-bottom: 18px; gap: 10px; }
      .product-seller-avatar { width: 40px; height: 40px; font-size: 0.9rem; }
      .product-seller-name { font-size: 0.9rem; }
      .product-seller-label { font-size: 0.72rem; }
      .qty-selector { gap: 10px; margin-bottom: 14px; }
      .qty-selector label { font-size: 0.88rem; }
      .qty-btn { padding: 8px 14px; font-size: 0.95rem; }
      .qty-value { padding: 8px 16px; min-width: 44px; font-size: 0.95rem; }
      .btn-orange.btn-lg { padding: 14px 20px; font-size: 0.95rem; }
      .similar-section { margin-top: 40px; }
      .similar-section h2 { font-size: 1.2rem; margin-bottom: 16px; }
      .order-summary { padding: 12px; margin-bottom: 16px; }
      .order-summary-row { font-size: 0.85rem; padding: 5px 0; }
      .order-summary-row.total { font-size: 1rem; padding-top: 10px; }
    }
    
    @media (max-width: 380px) {
      .shop-hero-info h1 { font-size: 1.15rem; }
      .product-detail-info h1 { font-size: 1.1rem; }
      .product-detail-price { font-size: 1.35rem; }
      .products-grid { gap: 8px; }
      .product-info { padding: 8px; }
      .product-name { font-size: 0.78rem; }
      .product-price { font-size: 0.82rem; }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="shop-page" id="shop-page">
    <div id="loading" class="loading-container">
      <span class="spinner spinner-blue" style="width: 40px; height: 40px;"></span>
    </div>
    <div id="content" class="hidden"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let currentProduct = null;
    let currentShop = null;
    let quantity = 1;
    
    const COLOR_HEX = {
      'rouge': '#EF4444', 'bleu': '#1E88E5', 'noir': '#0F172A',
      'blanc': '#FFFFFF', 'marron': '#78350F', 'beige': '#F5DEB3',
      'vert': '#10B981', 'jaune': '#FBBF24', 'rose': '#EC4899',
      'violet': '#8B5CF6', 'gris': '#9CA3AF', 'orange': '#FF8A3D',
      'doré': '#D4AF37', 'argent': '#C0C0C0',
    };
    
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();
      route();
    });
    
    function route() {
      const params = new URLSearchParams(window.location.search);
      
      if (params.get('product')) {
        loadProductDetail(parseInt(params.get('product')));
      } else if (params.get('id')) {
        loadShop(parseInt(params.get('id')));
      } else {
        showError(t('product.no_products'));
      }
    }
    
    function getAvailabilityLabel(availability) {
      const labels = {
        'in_stock': t('product.in_stock'),
        'out_of_stock': t('product.out_of_stock_label'),
        'to_confirm': t('product.to_confirm'),
      };
      return labels[availability] || availability;
    }
    
    function getAvailabilityClass(availability) {
      const classes = {
        'in_stock': 'availability-in_stock',
        'out_of_stock': 'availability-out_of_stock',
        'to_confirm': 'availability-to_confirm',
      };
      return classes[availability] || 'availability-in_stock';
    }
    
    async function loadShop(shopId) {
      try {
        const [shop, products] = await Promise.all([
          ShopsAPI.getById(shopId),
          ProductsAPI.getByShop(shopId, { sort_by: 'sales' }),
        ]);
        
        currentShop = shop;
        document.title = `${shop.name} — Finest Global`;
        
        renderShopPage(shop, products);
        showContent();
        
        TrackAPI.pageview({ path: `/shop/${shopId}`, shop_id: shopId }).catch(() => {});
      } catch (error) {
        showError(error.message);
      }
    }
    
    function renderShopPage(shop, products) {
      const initials = shop.name.substring(0, 2).toUpperCase();
      
      const codeBadge = shop.code 
        ? `<div class="shop-code-badge" onclick="copyCode('${escapeHtml(shop.code)}')">
             🔖 ${t('product.shop_code')} : <span class="code">${escapeHtml(shop.code)}</span>
           </div>`
        : '';
      
      const localityStats = [];
      if (shop.locality) {
        localityStats.push(`<span>📍 ${escapeHtml(shop.locality)}</span>`);
      }
      if (shop.market) {
        localityStats.push(`<span>🏪 ${escapeHtml(shop.market)}</span>`);
      }
      localityStats.push(`<span>👁️ ${shop.views_count} ${t('product.views')}</span>`);
      localityStats.push(`<span>📦 ${products.length} ${t('seller.product')}${products.length > 1 ? 's' : ''}</span>`);
      
      document.getElementById('content').innerHTML = `
        <div class="shop-hero">
          <div class="container">
            <div class="shop-hero-inner">
              <div class="shop-hero-avatar">${initials}</div>
              <div class="shop-hero-info">
                ${codeBadge}
                <h1>${escapeHtml(shop.name)}</h1>
                <p>${escapeHtml(shop.description || '—')}</p>
                <div class="shop-hero-stats">
                  ${localityStats.join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="shop-toolbar">
          <div class="container">
            <div class="shop-toolbar-inner">
              <h2 data-i18n="product.all_products">${t('product.all_products')}</h2>
              <select class="sort-select" id="sort-select" onchange="sortShopProducts(${shop.id})">
                <option value="sales" data-i18n="marketplace.sort_sales">${t('marketplace.sort_sales')}</option>
                <option value="recent" data-i18n="marketplace.sort_recent">${t('marketplace.sort_recent')}</option>
                <option value="price_asc" data-i18n="marketplace.sort_price_asc">${t('marketplace.sort_price_asc')}</option>
                <option value="price_desc" data-i18n="marketplace.sort_price_desc">${t('marketplace.sort_price_desc')}</option>
              </select>
            </div>
          </div>
        </div>
        
        <div class="products-section">
          <div class="container">
            <div class="products-grid" id="shop-products">
              ${renderProducts(products)}
            </div>
          </div>
        </div>
      `;
    }
    
    function copyCode(code) {
      navigator.clipboard.writeText(code);
      showToast('📋 ' + code, 'success');
    }
    
    function renderProducts(products) {
      if (products.length === 0) {
        return `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">📦</div>
            <h3 data-i18n="product.no_products">${t('product.no_products')}</h3>
            <p data-i18n="product.no_products_p">${t('product.no_products_p')}</p>
          </div>
        `;
      }
      
      return products.map(p => {
        const availability = p.availability || 'in_stock';
        const availabilityLabel = getAvailabilityLabel(availability);
        const availabilityClass = getAvailabilityClass(availability);
        
        return `
          <a href="/shop.html?product=${p.id}" class="product-card">
            <div class="product-image">
              ${p.photo_url ? `<img src="${imageUrl(p.photo_url)}" alt="${escapeHtml(p.name)}" loading="lazy">` : '📦'}
              ${p.sales_count > 0 ? `<div class="product-badge-sales">${p.sales_count} ${p.sales_count > 1 ? 'ventes' : 'vente'}</div>` : ''}
              <span class="product-badge-availability ${availabilityClass}">${availabilityLabel}</span>
            </div>
            <div class="product-info">
              <div class="product-name">${escapeHtml(p.name)}</div>
              <div class="product-footer">
                <div class="product-price">${formatPrice(p.price)}</div>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }
    
    async function sortShopProducts(shopId) {
      const sortBy = document.getElementById('sort-select').value;
      try {
        const products = await ProductsAPI.getByShop(shopId, { sort_by: sortBy });
        document.getElementById('shop-products').innerHTML = renderProducts(products);
      } catch (error) {
        showToast(error.message, 'error');
      }
    }
    
    async function loadProductDetail(productId) {
      try {
        const product = await ProductsAPI.getById(productId);
        currentProduct = product;
        
        const shop = await ShopsAPI.getById(product.shop_id);
        currentShop = shop;
        
        document.title = `${product.name} — Finest Global`;
        
        let similar = [];
        if (product.category) {
          similar = await ProductsAPI.getByShop(product.shop_id, {
            category: product.category,
            limit: 5,
          });
          similar = similar.filter(p => p.id !== product.id).slice(0, 4);
        }
        
        renderProductDetail(product, shop, similar);
        showContent();
        
        TrackAPI.pageview({
          path: `/product/${productId}`,
          product_id: productId,
          shop_id: shop.id,
        }).catch(() => {});
      } catch (error) {
        showError(error.message);
      }
    }
    
    function renderProductDetail(product, shop, similar) {
      const colorHex = product.color && COLOR_HEX[product.color.toLowerCase()]
        ? COLOR_HEX[product.color.toLowerCase()] : null;
      
      const availability = product.availability || 'in_stock';
      const availabilityLabel = getAvailabilityLabel(availability);
      const availabilityClass = getAvailabilityClass(availability);
      
      const stockEmoji = {
        'in_stock': '✅',
        'out_of_stock': '❌',
        'to_confirm': '⏳',
      }[availability] || '✅';
      
      const shopBadges = [];
      if (shop.code) {
        shopBadges.push(`<span class="badge badge-orange" style="cursor:pointer;" onclick="copyCode('${escapeHtml(shop.code)}')">🔖 ${escapeHtml(shop.code)}</span>`);
      }
      if (shop.locality) {
        shopBadges.push(`<span class="badge badge-blue">📍 ${escapeHtml(shop.locality)}</span>`);
      }
      if (shop.market) {
        shopBadges.push(`<span class="badge badge-blue">🏪 ${escapeHtml(shop.market)}</span>`);
      }
      
      document.getElementById('content').innerHTML = `
        <div class="product-detail">
          <div class="container">
            <div class="product-detail-grid">
              
              <div class="product-detail-image">
                ${product.photo_url 
                  ? `<img src="${imageUrl(product.photo_url)}" alt="${escapeHtml(product.name)}">` 
                  : '📦'}
                <span class="product-badge-availability ${availabilityClass}" style="top:16px;right:16px;">${availabilityLabel}</span>
              </div>
              
              <div class="product-detail-info">
                <h1>${escapeHtml(product.name)}</h1>
                
                <div class="product-detail-meta">
                  ${product.category ? `<span class="badge badge-blue" style="text-transform:capitalize;">${product.category}</span>` : ''}
                  ${product.color ? `<span class="badge badge-blue"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colorHex};margin-right:4px;vertical-align:middle;"></span>${product.color}</span>` : ''}
                </div>
                
                <div class="product-detail-price">${formatPrice(product.price)}</div>
                
                <div class="product-detail-stats">
                  <div class="stat-box">
                    <div class="stat-value">${product.sales_count}</div>
                    <div class="stat-label" data-i18n="product.sales">${t('product.sales')}</div>
                  </div>
                  <div class="stat-box">
                    <div class="stat-value">${product.views_count}</div>
                    <div class="stat-label" data-i18n="product.views">${t('product.views')}</div>
                  </div>
                  <div class="stat-box">
                    <div class="stat-value">${stockEmoji}</div>
                    <div class="stat-label" data-i18n="product.stock">${t('product.stock')}</div>
                  </div>
                </div>
                
                <div class="product-detail-desc">
                  ${escapeHtml(product.description || '—')}
                </div>
                
                <div class="product-seller">
                  <div class="product-seller-avatar">${shop.name.substring(0, 2).toUpperCase()}</div>
                  <div class="product-seller-info">
                    <div class="product-seller-label" data-i18n="product.sold_by">${t('product.sold_by')}</div>
                    <div class="product-seller-name">${escapeHtml(shop.name)}</div>
                    ${shopBadges.length > 0 ? `<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">${shopBadges.join('')}</div>` : ''}
                  </div>
                  <a href="/shop.html?id=${shop.id}" class="btn btn-ghost btn-sm" data-i18n="product.see_shop">${t('product.see_shop')}</a>
                </div>
                
                <div class="qty-selector">
                  <label data-i18n="product.quantity">${t('product.quantity')}</label>
                  <div class="qty-controls">
                    <button class="qty-btn" onclick="changeQty(-1)">−</button>
                    <span class="qty-value" id="qty-value">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                  </div>
                </div>
                
                <button 
                  class="btn btn-orange btn-lg btn-block" 
                  id="order-btn"
                  onclick="openOrderModal()"
                  ${availability === 'out_of_stock' ? 'disabled' : ''}
                >
                  ${availability === 'out_of_stock' 
                    ? t('product.out_of_stock') 
                    : '🛒 ' + t('product.order_now').replace('🛒 ', '')}
                </button>
              </div>
              
            </div>
            
            ${similar.length > 0 ? `
              <div class="similar-section">
                <h2 data-i18n="product.similar">${t('product.similar')}</h2>
                <div class="products-grid">
                  ${similar.map(p => {
                    const simAvail = p.availability || 'in_stock';
                    return `
                      <a href="/shop.html?product=${p.id}" class="product-card">
                        <div class="product-image">
                          ${p.photo_url ? `<img src="${imageUrl(p.photo_url)}" alt="${escapeHtml(p.name)}" loading="lazy">` : '📦'}
                          ${p.sales_count > 0 ? `<div class="product-badge-sales">${p.sales_count} ${p.sales_count > 1 ? 'ventes' : 'vente'}</div>` : ''}
                          <span class="product-badge-availability ${getAvailabilityClass(simAvail)}">${getAvailabilityLabel(simAvail)}</span>
                        </div>
                        <div class="product-info">
                          <div class="product-name">${escapeHtml(p.name)}</div>
                          <div class="product-footer">
                            <div class="product-price">${formatPrice(p.price)}</div>
                          </div>
                        </div>
                      </a>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}
            
          </div>
        </div>
        
        <div id="order-modal" class="hidden"></div>
      `;
    }
    
    function changeQty(delta) {
      quantity = Math.max(1, quantity + delta);
      document.getElementById('qty-value').textContent = quantity;
    }
    
    function openOrderModal() {
      if (!Auth.isAuthenticated()) {
        showToast(t('login.title'), 'warning');
        setTimeout(() => {
          window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        }, 1000);
        return;
      }
      
      const user = Auth.getUser();
      
      if (user.id === currentShop.owner_id) {
        showToast('—', 'error');
        return;
      }
      
      const total = currentProduct.price * quantity;
      const modal = document.getElementById('order-modal');
      modal.innerHTML = `
        <div class="modal-overlay" onclick="closeOrderModal(event)" style="position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;">
          <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="order-modal-title" onclick="event.stopPropagation()" style="background:var(--white);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-lg);">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;">
              <h2 id="order-modal-title" style="margin:0;color:var(--blue-900);">${t('product.order_now')}</h2>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeOrderModal()" aria-label="Fermer">✕</button>
            </div>
            <div class="order-summary">
              <div class="order-summary-row"><span>${t('product.product') || 'Produit'}</span><strong>${escapeHtml(currentProduct.name)}</strong></div>
              <div class="order-summary-row"><span>${t('product.quantity')}</span><strong>${quantity}</strong></div>
              <div class="order-summary-row"><span>${t('product.price') || 'Prix unitaire'}</span><strong>${formatPrice(currentProduct.price)}</strong></div>
              <div class="order-summary-row total"><span>${t('product.total') || 'Total estimé'}</span><strong>${formatPrice(total)}</strong></div>
            </div>
            <p style="font-size:.9rem;color:var(--gray-600);line-height:1.5;margin-bottom:16px;">${t('product.order_note_help') || 'Ajoutez une précision pour le vendeur si nécessaire. La commande sera envoyée au vendeur pour confirmation.'}</p>
            <label for="order-note" style="display:block;font-weight:600;margin-bottom:8px;color:var(--gray-700);">${t('product.note') || 'Note (facultatif)'}</label>
            <textarea id="order-note" rows="3" maxlength="1000" placeholder="${t('product.note_placeholder') || 'Précisez la couleur, la taille ou toute autre demande…'}" style="box-sizing:border-box;width:100%;padding:12px;border:1px solid var(--gray-300);border-radius:var(--radius);font:inherit;resize:vertical;margin-bottom:12px;"></textarea>
            <p style="font-size:.85rem;color:var(--gray-600);margin:0 0 16px;">${t('product.phone') || 'Téléphone'} : ${escapeHtml(user.phone || user.phone_number || 'Les coordonnées associées à votre compte pourront être utilisées pour vous contacter.')}</p>
            <div id="order-error" class="hidden" role="alert" style="background:#FEE2E2;color:#991B1B;padding:10px 12px;border-radius:var(--radius);margin-bottom:12px;"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
              <button type="button" class="btn btn-ghost" onclick="closeOrderModal()">${t('common.cancel') || 'Annuler'}</button>
              <button type="button" class="btn btn-orange" id="confirm-order-btn" onclick="confirmOrder()">${t('product.confirm') || 'Confirmer la commande'}</button>
            </div>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeOrderModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const modal = document.getElementById('order-modal');
      if (modal) modal.classList.add('hidden');
    }

    async function confirmOrder() {
      const btn = document.getElementById('confirm-order-btn');
      const errorDiv = document.getElementById('order-error');
      const noteField = document.getElementById('order-note');
      if (!btn || !errorDiv || !noteField || !currentProduct) return;
      const note = noteField.value.trim();
      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = t('product.loading') || 'Envoi en cours…';
      try {
        await OrdersAPI.create({
          product_id: currentProduct.id,
          quantity: quantity,
          note: note || null,
        });
        showToast(t('product.order_success') || 'Commande envoyée avec succès.', 'success', 5000);
        closeOrderModal();
        setTimeout(() => { window.location.href = '/index.html'; }, 1500);
      } catch (error) {
        errorDiv.textContent = error && error.message ? error.message : (t('common.error') || 'Une erreur est survenue. Réessayez.');
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = t('product.confirm') || 'Confirmer la commande';
      }
    }

    function showContent() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
    }

    function showError(message) {
      document.getElementById('loading').classList.add('hidden');
      const content = document.getElementById('content');
      content.classList.remove('hidden');
      content.innerHTML = `
        <div class="container" style="padding:80px 24px;">
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>${t('common.error') || 'Une erreur est survenue'}</h3>
            <p>${escapeHtml(message || 'Impossible de charger cette page.')}</p>
            <a href="/marketplace.html" class="btn btn-primary mt-16">${t('marketplace.reset_filters') || 'Retour au catalogue'}</a>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
