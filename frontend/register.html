<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Inscription — Finest Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--blue-50) 0%, var(--white) 100%);
    }
    
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    
    .auth-header p {
      color: var(--gray-500);
      font-size: 0.95rem;
    }
    
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    
    .role-card {
      padding: 20px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--white);
    }
    
    .role-card:hover {
      border-color: var(--blue-500);
    }
    
    .role-card.active {
      border-color: var(--blue-700);
      background: var(--blue-50);
    }
    
    .role-icon {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    
    .role-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--blue-900);
      margin-bottom: 4px;
    }
    
    .role-desc {
      font-size: 0.8rem;
      color: var(--gray-500);
    }
    
    .auth-form {
      display: none;
    }
    
    .auth-form.active {
      display: block;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--gray-500);
    }
    
    .auth-footer a {
      color: var(--blue-700);
      font-weight: 600;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    /* ============================================================
       RESPONSIVE — TÉLÉPHONE ANDROID
       ============================================================ */
    @media (max-width: 640px) {
      .auth-page {
        padding: 24px 14px;
        min-height: calc(100vh - 60px);
      }
      
      .auth-card {
        padding: 28px 20px;
        border-radius: var(--radius);
      }
      
      .auth-header {
        margin-bottom: 24px;
      }
      
      .auth-header h1 {
        font-size: 1.4rem;
      }
      
      .auth-header p {
        font-size: 0.88rem;
      }
      
      .role-selector {
        gap: 10px;
        margin-bottom: 22px;
      }
      
      .role-card {
        padding: 16px 10px;
      }
      
      .role-icon {
        font-size: 1.5rem;
        margin-bottom: 6px;
      }
      
      .role-title {
        font-size: 0.88rem;
      }
      
      .role-desc {
        font-size: 0.75rem;
      }
      
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      
      .form-label {
        font-size: 0.85rem;
      }
      
      .form-input {
        padding: 11px 14px;
        font-size: 0.92rem;
      }
      
      .btn-lg {
        padding: 13px 20px;
        font-size: 0.92rem;
      }
      
      .form-hint {
        font-size: 0.78rem;
      }
      
      .auth-footer {
        margin-top: 20px;
        font-size: 0.85rem;
      }
    }
    
    /* ============================================================
       RESPONSIVE — TRÈS PETIT TÉLÉPHONE
       ============================================================ */
    @media (max-width: 380px) {
      .auth-card {
        padding: 24px 16px;
      }
      
      .auth-header h1 {
        font-size: 1.25rem;
      }
      
      .role-card {
        padding: 14px 8px;
      }
      
      .role-icon {
        font-size: 1.35rem;
      }
      
      .role-title {
        font-size: 0.82rem;
      }
      
      .role-desc {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="auth-page">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1>Créer un compte</h1>
        <p>Rejoignez Finest Global en quelques secondes</p>
      </div>
      
      <!-- Choix du rôle -->
      <div class="role-selector">
        <div class="role-card active" onclick="selectRole('client')" id="role-client">
          <div class="role-icon">🛒</div>
          <div class="role-title">Client</div>
          <div class="role-desc">Acheter</div>
        </div>
        <div class="role-card" onclick="selectRole('seller')" id="role-seller">
          <div class="role-icon">🏪</div>
          <div class="role-title">Vendeur</div>
          <div class="role-desc">Vendre</div>
        </div>
      </div>
      
      <!-- FORMULAIRE CLIENT (nom + téléphone + password) -->
      <form class="auth-form active" id="form-client" onsubmit="registerClient(event)">
        <div id="client-error" class="alert alert-error hidden"></div>
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">Prénom</label>
            <input 
              type="text" 
              class="form-input" 
              id="client-firstname"
              placeholder="Ex: Aïcha"
              required
            >
          </div>
          <div class="form-group">
            <label class="form-label required">Nom</label>
            <input 
              type="text" 
              class="form-input" 
              id="client-lastname"
              placeholder="Ex: Dossou"
              required
            >
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label required">Numéro de téléphone</label>
          <input 
            type="tel" 
            class="form-input" 
            id="client-phone"
            placeholder="01 XX XX XX XX"
            maxlength="10"
            required
          >
          <div class="form-hint">
            Format : 01 + 8 chiffres.
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label required">Mot de passe</label>
          <input 
            type="password" 
            class="form-input" 
            id="client-password"
            placeholder="Minimum 6 caractères"
            minlength="6"
            required
          >
          <div class="form-hint">
            Au moins 6 caractères.
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register-client">
          Créer mon compte client
        </button>
      </form>
      
      <!-- FORMULAIRE VENDEUR -->
      <form class="auth-form" id="form-seller" onsubmit="registerSeller(event)">
        <div id="seller-error" class="alert alert-error hidden"></div>
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">Prénom</label>
            <input 
              type="text" 
              class="form-input" 
              id="seller-firstname"
              placeholder="Ex: Aïcha"
              required
            >
          </div>
          <div class="form-group">
            <label class="form-label required">Nom</label>
            <input 
              type="text" 
              class="form-input" 
              id="seller-lastname"
              placeholder="Ex: Dossou"
              required
            >
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label required">Numéro de téléphone</label>
          <input 
            type="tel" 
            class="form-input" 
            id="seller-phone"
            placeholder="01 XX XX XX XX"
            maxlength="10"
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label required">Email</label>
          <input 
            type="email" 
            class="form-input" 
            id="seller-email"
            placeholder="vous@exemple.com"
            required
          >
        </div>
        
        <div class="form-group">
          <label class="form-label required">Mot de passe</label>
          <input 
            type="password" 
            class="form-input" 
            id="seller-password"
            placeholder="Minimum 6 caractères"
            minlength="6"
            required
          >
          <div class="form-hint">
            Au moins 6 caractères.
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register-seller">
          Créer mon compte vendeur
        </button>
      </form>
      
      <div class="auth-footer">
        Déjà un compte ? 
        <a href="/login.html">Se connecter</a>
      </div>
      
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();
      
      if (Auth.isAuthenticated()) {
        window.location.href = '/index.html';
      }
    });
    
    function selectRole(role) {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      
      document.getElementById(`role-${role}`).classList.add('active');
      document.getElementById(`form-${role}`).classList.add('active');
    }
    
    // ============================================================
    // INSCRIPTION CLIENT (nom + téléphone + password)
    // ============================================================
    
    async function registerClient(event) {
      event.preventDefault();
      
      const errorDiv = document.getElementById('client-error');
      const btn = document.getElementById('btn-register-client');
      
      errorDiv.classList.add('hidden');
      
      const data = {
        first_name: document.getElementById('client-firstname').value.trim(),
        last_name: document.getElementById('client-lastname').value.trim(),
        phone: document.getElementById('client-phone').value.trim(),
        password: document.getElementById('client-password').value,
      };
      
      // Validations
      if (!data.first_name || !data.last_name) {
        errorDiv.textContent = 'Le prénom et le nom sont obligatoires.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (data.phone.length !== 10 || !data.phone.startsWith('01')) {
        errorDiv.textContent = 'Le numéro doit être à 10 chiffres et commencer par 01.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (data.password.length < 6) {
        errorDiv.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Création...';
      
      try {
        const result = await UsersAPI.registerClient(data);
        Auth.setSession(result.access_token, result.user);
        showToast('Compte client créé !', 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 800);
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Créer mon compte client';
      }
    }
    
    // ============================================================
    // INSCRIPTION VENDEUR
    // ============================================================
    
    async function registerSeller(event) {
      event.preventDefault();
      
      const errorDiv = document.getElementById('seller-error');
      const btn = document.getElementById('btn-register-seller');
      
      errorDiv.classList.add('hidden');
      
      const data = {
        first_name: document.getElementById('seller-firstname').value.trim(),
        last_name: document.getElementById('seller-lastname').value.trim(),
        phone: document.getElementById('seller-phone').value.trim(),
        email: document.getElementById('seller-email').value.trim(),
        password: document.getElementById('seller-password').value,
      };
      
      if (data.phone.length !== 10 || !data.phone.startsWith('01')) {
        errorDiv.textContent = 'Le numéro doit être à 10 chiffres et commencer par 01.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (data.password.length < 6) {
        errorDiv.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Création...';
      
      try {
        const result = await UsersAPI.registerSeller(data);
        Auth.setSession(result.access_token, result.user);
        showToast('Compte vendeur créé !', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard-seller.html';
        }, 800);
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Créer mon compte vendeur';
      }
    }
  </script>
</body>
</html>
